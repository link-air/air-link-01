/* ---------- 设置页「人格」块（2026-10-05）----------
   人格文件（`self/personas/*.md`）的编辑器：列表 + 新建 + 编辑 + 停用 / 恢复。
   **文件是真源**——这里只调后端那三个写口，不自己拼路径、不自己校验
   （id 规则 / 上限 / 撞名都在 `core/persona.py`：两处各判一次必然漂）。
   显示名（文件首行 `# xxx`）、字数、常驻块体量全部由 `/api/persona` 给，
   页面不抄这些数（同「不抄后端常量」那条）。

   体量的**实时预估**是线性的：人格正文原样拼进常驻块，所以
   `新体量 = 旧体量 − 旧字数 + 新字数`——不必为每一次敲键盘去问后端。 */
let P_META = {limit: 0, cur: null};     // 这一屏的数（编辑时算预估用）
let P_TEMPLATE = "";                    // 新建的起步骨架（后端给）

function personaBlockHTML(d){
  P_META = {limit: d.limit || 0, cur: null};
  P_TEMPLATE = d.template || "";
  const rows = (d.items || []).map(it => {
    const tags = [];
    if(it.id === d.persona) tags.push(`<span class="tag ok">${t("在用")}</span>`);
    if(it.builtin) tags.push(`<span class="tag">${t("内置")}</span>`);
    if(!it.enabled) tags.push(`<span class="tag warn">${t("停用中")}</span>`);
    const over = it.enabled && d.limit && it.fixed > d.limit;
    // 停用的不算体量：它不占提示词（后端也不试算——`.off` 读出来是 air 的数，
    // 摆出来比空着更容易看错）
    const meta = it.enabled
      ? `${it.chars} ${t("字")} · ${t("常驻块")} ${it.fixed || 0} / ${d.limit}`
        + (over ? ` <span class="tag bad">${t("超了预算")}</span>` : "")
      : t("（停用中，不占提示词）");
    // `air` 没有「停用」：它是兜底——别人格文件缺失时靠它顶上
    const btns = it.enabled
      ? `<button class="ghost" onclick="pEdit('${esc(it.id)}')">${t("编辑")}</button>`
        + (it.id === "air" ? ""
           : `<button class="ghost" onclick="pToggle('${esc(it.id)}', false)">${t("停用")}</button>`)
      : `<button class="ghost" onclick="pToggle('${esc(it.id)}', true)">${t("恢复")}</button>`;
    return `<div class="pRow">
      <span class="nm"><b>${esc(it.display)}</b>
        <span class="why" style="display:inline">${esc(it.id)}</span></span>
      <span class="meta">${meta} ${tags.join(" ")}</span>
      <span style="display:flex;gap:6px">${btns}</span>
    </div>`;
  }).join("");
  return `
  <div class="grp" style="padding:0 0 8px">${t("人格")}</div>
  <div class="why" style="margin:0 0 8px">${t("人格文件在 self/personas/ 下——她是谁，来这儿定。改完下一句就生效；记忆不跟着分家：换谁说话，看到的都是同一份记忆。")}</div>
  <div id="pMsg" class="why" style="margin:0 0 6px"></div>
  <div id="pList">${rows || `<div class="empty">${t("（空）")}</div>`}</div>
  <div style="margin-top:10px"><button class="ghost" onclick="pNew()">${t("新建人格")}</button></div>
  <div id="pEditor"></div>
  <div style="height:18px"></div>`;
}

async function pEdit(id){
  try{
    const d = await api("/api/persona?id=" + encodeURIComponent(id));
    const it = d.item || {};
    P_META.cur = {chars: it.chars || 0, fixed: it.fixed || 0};
    pOpenEditor({id, text: d.text || "", isNew: false});
  }catch(e){ alert(t("读取失败：") + e.message); }
}
function pNew(){
  P_META.cur = null;
  pOpenEditor({id: "", text: P_TEMPLATE, isNew: true});
}
function pOpenEditor(o){
  const box = $("pEditor");
  box.classList.add("open");
  box.innerHTML = `
    <div class="why" style="margin:0 0 8px">${o.isNew
      ? t("新建人格：id 只用小写英文 / 数字 / `_` / `-`（2–16 位）——它会写进对话原文的署名，中文和符号会让原文解析认不出人。")
      : t("编辑「{name}」——整份文件都会原样给 {p} 看（章节名只是习惯，不是格式）。", {name: o.id})}</div>
    ${o.isNew ? `<div class="grid2" style="margin-bottom:8px">
      <label>id</label><input class="f" id="pId" placeholder="mo" spellcheck="false"></div>` : ""}
    <textarea id="pText" spellcheck="false"></textarea>
    <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
      <button class="primary" onclick="${o.isNew ? "pCreate()" : `pSave('${esc(o.id)}')`}">${t("保存")}</button>
      <button class="ghost" onclick="pClose()">${t("取消")}</button>
      <span id="pCount" class="why" style="margin:0"></span>
    </div>`;
  $("pText").value = o.text || "";
  $("pText").addEventListener("input", pCount);
  pCount();
  box.scrollIntoView({block:"nearest"});
}
function pClose(){
  const b = $("pEditor");
  b.classList.remove("open");
  b.innerHTML = "";
  P_META.cur = null;
}
function pCount(){
  const ta = $("pText");
  if(!ta) return;
  const n = ta.value.trim().length;
  let s = t("字数 {n}", {n});
  if(P_META.cur){
    const est = Math.max(0, P_META.cur.fixed - P_META.cur.chars + n);
    s += " · " + t("常驻块约 {a} / {b}", {a: est, b: P_META.limit});
    if(P_META.limit && est > P_META.limit) s += " ⚠️ " + t("超了预算");
  } else if(P_META.limit){
    s += " · " + t("常驻块预算上限 {b}（新建后计入）", {b: P_META.limit});
  }
  const el = $("pCount");
  if(el) el.textContent = s;
}
async function pSave(id){
  try{
    const d = await api("/api/persona-save", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({id, text: $("pText").value})});
    if(!d.ok){ alert(d.detail || t("保存失败")); return; }
    await pAfter(d.changed ? t("已保存「{name}」——下一句起就用新的。", {name: id}) : t("没改动。"));
  }catch(e){ alert(t("保存失败：") + e.message); }
}
async function pCreate(){
  const idEl = $("pId");
  const id = idEl ? idEl.value.trim() : "";
  try{
    const d = await api("/api/persona-create", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({id, text: $("pText").value})});
    if(!d.ok){ alert(d.detail || t("保存失败")); return; }
    await pAfter(t("建好了「{name}」——想用就在顶栏「和谁聊」里切过去。",
                   {name: (d.item || {}).id || id}));
  }catch(e){ alert(t("保存失败：") + e.message); }
}
async function pToggle(id, on){
  if(!confirm(on ? t("恢复「{name}」？", {name: id})
                 : t("停用「{name}」？文件会改名成 .md.off——不删，随时能恢复。", {name: id}))) return;
  try{
    const d = await api("/api/persona-enable", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify({id, on})});
    if(!d.ok){ alert(d.detail || t("保存失败")); return; }
    await pAfter(d.switched_to
      ? t("已停用「{name}」——正在用的就是它，已切回 {p}。", {name: id}) : "");
  }catch(e){ alert(t("保存失败：") + e.message); }
}
/* 写完之后：顶栏（名单 / 显示名 / 当前人格）与这一屏一起刷。
   顺序是有意的——`loadPersona` 先走（`{p}` 的取值跟着它），再刷静态文案，
   最后重渲染面板（新节点挂上去之后才写 #pMsg）。 */
async function pAfter(msg){
  await loadPersona();
  paintStatic();
  await refreshPanel();
  const el = $("pMsg");
  if(el && msg) el.textContent = msg;
}

/* ---------- 语音（独立一页）----------
   三块：服务（起 / 关 + 状态）、声音模型（`tts/voice.json` 的白名单字段）、
   说话的声音（基底音色 + 微调刻度 + 音色描述，走 `user_prefs`，下一句生效）。
   「换模型要重启服务」是这一页唯一的重操作——所以配了一个「保存并重启」。

   这一页的规矩：**凡是"有哪些选项"，一律从服务那边拿，页面不抄一份**
   （音色清单、刻度定义都是）。抄了就是两边各自漂移的开始——今天加一个维度，
   页面显示不出来，看着像"服务坏了"。 */

// 音色清单与刻度定义：`viewVoice` 渲染时从 `/health` 填进来。
// 放在全局是因为下拉要能**原地重排**（勾「显示全部」时重建 options，不重刷整页）。
let VOICE_SPK = {base: [], all: [], svc: "", now: ""};
let VOICE_DIMS = {};
let voiceShowAll = false;

/* 小写去重；并把**当前在用的那个补在最前面**——它若正好落在被挡的名单上，
   不放进来下拉就会显示成"跟随语音服务"，看着像他的设置丢了。 */
function meritSpk(list, keep){
  const out = [], seen = new Set();
  const add = (x) => {
    const s = String(x || "").trim();
    if(!s || seen.has(s.toLowerCase())) return;
    seen.add(s.toLowerCase()); out.push(s);
  };
  add(keep);
  (list || []).forEach(add);
  return out;
}
function speakerOpts(){
  const list = voiceShowAll ? VOICE_SPK.all : VOICE_SPK.base;
  const now = (VOICE_SPK.now || "").toLowerCase();
  return [`<option value="">${t("跟随语音服务（{svc}）", {svc: esc(VOICE_SPK.svc || t("默认"))})}</option>`]
    .concat(list.map(x => `<option value="${esc(x)}"${x.toLowerCase() === now ? " selected" : ""}>${esc(x)}</option>`))
    .join("");
}
function toggleVoiceShowAll(){
  voiceShowAll = !!($("voiceShowAll") || {}).checked;
  const sel = $("voiceSpeaker");
  if(!sel) return;
  const keep = sel.value;                      // 重排不能把他刚选的那个丢了
  sel.innerHTML = speakerOpts();
  sel.value = kept(keep, sel) ? keep : "";
}
/* `<select>` 换了一批 options 之后，`value=` 赋进去的值如果不在新表里会被静默改成 ""——
   那是"我选了，但它悄悄跳回默认"的经典样子。所以先确认它在，不在才认 ""。 */
function kept(v, sel){
  return Array.from(sel.options).some(o => o.value === v);
}
/* 滑块拖动时把当前那档的**中文描述**显示出来——数字没意义，"偏低沉"才有。 */
function dimShow(k){
  const spec = VOICE_DIMS[k];
  const el = $("vd_" + k), txt = $("vdt_" + k);
  if(!spec || !el || !txt) return;
  const opts = spec[1] || [];
  txt.textContent = t(opts[parseInt(el.value, 10)] || "默认");
}
/* 表单现在的值 → 一次请求要的形状。**一处收集，保存和试听共用**
   （两边各读一遍输入框的下场：某天加了一个字段，只有一边带上）。 */
function readVoiceForm(){
  const dims = {};
  Object.keys(VOICE_DIMS).forEach(k => {
    const el = $("vd_" + k);
    if(el) dims[k] = parseInt(el.value, 10);
  });
  return {speaker: (($("voiceSpeaker") || {}).value || ""), dims,
          extra: (($("voiceExtra") || {}).value || "")};
}
function resetVoiceDims(){
  Object.keys(VOICE_DIMS).forEach(k => {
    const el = $("vd_" + k);
    if(el) el.value = String((VOICE_DIMS[k] || [])[2] ?? 2);
    dimShow(k);
  });
  const out = $("voiceOut");
  if(out) out.textContent = t("刻度已调回默认（还没保存）");
}
/* 模型候选：点一下填进输入框（输入框本身保留——也能手写 HF 仓库名）。 */
function fillModel(v){
  const el = $("vm_model");
  if(el) el.value = v;
}
/* 参考音频候选：同样点一下填入（refs/ 下的文件列表）。 */
function fillRef(v){
  const el = $("vm_ref_audio");
  if(el) el.value = v;
}
async function viewVoice(){
  const [v, c] = await Promise.all([api("/api/voice"), api("/api/voice/config")]);
  const st = v.status || {ok:false};
  const cur = v.voice || {};
  // 音色选项：**从服务来**（模型自己报的），页面里不抄一份——抄了会和模型漂移。
  // 两份清单：`base` 是过滤后（`voice.json` 点名挡掉的方言 / 外语不在里头），
  // `all` 是全表——平时用前者，勾了「显示全部」才给后者。挡掉 ≠ 删掉。
  VOICE_SPK = {
    // 当前存的那个音色**一定得在选项里**（哪怕它正好在被挡的名单上：那说明他当初
    // 就要它，界面不能悄悄把它换掉——下拉会显示成"跟随语音服务"，看着像设置丢了）
    base: meritSpk((st.speakers || []), cur.speaker),
    all:  meritSpk((st.speakers_all || st.speakers || []), cur.speaker),
    svc:  st.speaker || "",
    now:  cur.speaker || "",
  };
  VOICE_DIMS = st.dims || {};        // 维度定义也从服务来（`tts/server.py` 的 VOICE_DIMS）
  const extraVal = (cur.instruct_extra == null) ? "" : cur.instruct_extra;
  // 刻度只渲染**服务认得的那些维度**：维度表将来增删，页面跟着走，不用改这里。
  const dimRows = Object.keys(VOICE_DIMS).map(k => {
    const [lab, opts, dflt, maxv] = VOICE_DIMS[k] || ["", [], 2, 4];
    const val = (cur.dims && cur.dims[k] !== undefined) ? cur.dims[k] : dflt;
    return `
    <label>${esc(lab)}</label>
    <div style="display:flex;gap:10px;align-items:center">
      <input type="range" id="vd_${esc(k)}" min="0" max="${esc(String(maxv))}" step="1"
             value="${esc(String(val))}" style="flex:1;padding:0" oninput="dimShow('${esc(k)}')">
      <span class="why" id="vdt_${esc(k)}"
            style="margin:0;min-width:13em;text-align:right">${esc(t(opts[val] || "默认"))}</span>
    </div>`;
  }).join("");
  const cfg = (c && c.config) || {};
  const models = (c && c.models) || [];
  const modelOpts = models.map(m => `<option value="${esc(m)}"></option>`).join("");
  // 模型候选的**可见按钮**（点一下填进输入框）——datalist 只在聚焦时才现身，
  // "有什么可选"不该藏在一次点击后面（看不到 = 像没做过）。
  const modelBtns = models.map(m => {
    const short = String(m).split("/").pop().replace(/^Qwen3-TTS-12Hz-/, "");
    const tag = /-Base$/.test(m) ? t("（克隆）") : "";
    return `<button class="ghost" style="padding:2px 10px;font-size:12px"
      onclick="fillModel('${esc(m)}')">${esc(short)}${tag}</button>`;
  }).join("");
  // 现在跑的是哪条生成路（`/health` 经 `/api/voice` 透传）：克隆 / 预设音色 / GGUF。
  const kind = st.model_kind || "";
  let modeHint;
  if(!st.ok){
    modeHint = t("语音服务没起——起来后这里显示当前模式。");
  } else if(kind === "base"){
    modeHint = st.ref_anchor
      ? t("现在：克隆模式——{p} 用参考音频（{ref}）的声音说话。", {ref: st.ref_anchor})
      : t("现在：克隆模式，但参考音频没配上（voice.json 的 ref_audio）——播报会报错。");
  } else if(kind === "gguf"){
    modeHint = t("现在：GGUF 模型——这台 Windows 跑不了，请切回 torch 版。");
  } else {
    modeHint = t("现在：预设音色——在下面「说话的声音」里挑基底音色。");
  }
  // 文件里写的 vs 服务里跑的：不一样 = 改过了但还没重启（省得他对着两个值发懵）
  const pending = (st.ok && cfg.model && st.model && cfg.model !== st.model)
    ? ` <b>${t("（改过了，重启后生效）")}</b>` : "";
  // 参考音频（克隆用）：候选来自 refs/（主项目扫目录给的，同模型列表一条路）

  const refOpts = refs.map(r => `<option value="${esc(r)}"></option>`).join("");
  const refBtns = refs.map(r => {
    const short = String(r).split("/").pop();
    return `<button class="ghost" style="padding:2px 10px;font-size:12px"
      onclick="fillRef('${esc(r)}')">${esc(short)}</button>`;
  }).join("");
  const dtypes = ["bfloat16","float16","float32"];
  const langs = [...new Set([cfg.language, "Chinese","English","Japanese","Korean"].filter(Boolean))];
  return `
  <div class="grp" style="padding:0 0 8px">${t("语音服务")}</div>
  <div class="why" style="margin-bottom:10px">
    ${t("起 / 关都在顶栏那颗「语音」按钮上（关 = 放显存）。模型到第一次播报才读——要等十几秒。")}
  </div>
  <div class="grid2">
    <label>${t("状态")}</label>
    <div class="why" style="margin:0"><span id="voiceLine">${esc(voiceLine(st))}</span></div>
  </div>

  <div class="grp" style="padding:16px 0 8px">${t("声音模型")}</div>
  <div class="why" style="margin-bottom:10px">
    ${t("改的是 tts/voice.json——保存后要点「保存并重启」才生效。")}
  </div>
  <div class="grid2">
    <label>${t("模型")}</label>
    <div>
      <input class="f" id="vm_model" list="vmModels" value="${esc(cfg.model || "")}" style="width:100%;box-sizing:border-box">
      <datalist id="vmModels">${modelOpts}</datalist>
      <div class="why" style="margin:6px 0 4px">${t("点一下填入（也可以自己写 HF 仓库名）：")}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${modelBtns}</div>
      <div class="why" style="margin:8px 0 0">${modeHint}${pending}</div>
    </div>

    <select class="f" id="vm_dtype">${dtypes.map(x => `<option value="${x}"${x === cfg.dtype ? " selected" : ""}>${x}</option>`).join("")}</select>
    <label>${t("设备")}</label>
    <input class="f" id="vm_device" list="vmDevices" value="${esc(cfg.device || "cuda:0")}">

    <label>${t("语言")}</label>
    <input class="f" id="vm_language" list="vmLangs" value="${esc(cfg.language || "Chinese")}">
    <datalist id="vmLangs">${langs.map(x => `<option value="${esc(x)}"></option>`).join("")}</datalist>
    <label>${t("空闲卸载")}</label>
    <div style="display:flex;gap:8px;align-items:center">

      <input class="f" id="vm_ref_text" value="${esc(cfg.ref_text || "")}" style="width:100%;box-sizing:border-box">
      <div class="why" style="margin:6px 0 0">${t("那段录音逐字说了什么——要和录音一字不差（差得多，克隆会走样）。")}</div>

    <label></label>
    <div style="display:flex;gap:8px;align-items:center">

      <button class="ghost" onclick="restartVoice()">${t("保存并重启语音服务")}</button>
      <span id="vmOut" class="why">—</span>

async function saveVoiceModel(){
  const out = $("vmOut");
  const cfg = {model: $("vm_model").value, dtype: $("vm_dtype").value,
              device: $("vm_device").value, language: $("vm_language").value,
              idle_unload_minutes: parseInt($("vm_idle").value, 10) || 0};
  const refA = $("vm_ref_audio"), refT = $("vm_ref_text");
  if(refA) cfg.ref_audio = refA.value;      // 克隆参考（Base 模型用；空值 = 这次不改）
  if(refT) cfg.ref_text = refT.value;
  try{
    const d = await api("/api/voice/config", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify({config: cfg})});
    if(!d.ok) throw new Error(d.detail || t("保存失败："));
    const n = Object.keys(d.changed || {}).length;
    out.textContent = n ? t("已保存——重启语音服务后生效。") : t("没有变化。");
    return true;
  }catch(e){ out.textContent = t("保存失败：") + e.message; return false; }
}

/* 保存并重启：**换模型的完整动作**。重启只关 / 起服务，不预加载——
   所以几秒回来；新权重到第一次播报才读（跟第一次用一样）。 */
async function restartVoice(){
  const out = $("vmOut");
  out.textContent = t("正在保存…");
  if(!(await saveVoiceModel())) return;
  out.textContent = t("正在重启语音服务（先关、再起）…");
  try{
    await api("/api/voice/stop", {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"});
    out.textContent = t("旧的已关掉，正在起新的…");
    const d = await api("/api/voice/start", {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"});
    if(!d.ok) throw new Error(d.detail || t("起不来"));
    out.textContent = t("重启好了——新配置已生效（权重第一次播报时才读）。");
    const st = await api("/api/voice");
    const line = $("voiceLine");
    if(line) line.textContent = voiceLine(st.status);
  }catch(e){ out.textContent = t("重启失败：") + e.message; }
  refreshVoicePower();
}

/* 服务状态那一行的文案：**一处写、多处用**（渲染时一次；重启服务后原地更新一次）。 */
function voiceLine(st){
  if(!st || !st.ok) return t("没接上（{why}）", {why: (st && st.detail) || t("服务没起")});
  // 加载着的时候顺带说清"它凭什么还占着显存"：空闲多久了、还有多久自己放掉。
  let idle = "";
  if(st.loaded && st.idle_unload_minutes > 0){
    const used = (st.idle_seconds || 0) / 60;
    idle = t("（空闲 {a} 分钟，{b} 分钟后自动放掉显存）",
             {a: Math.floor(used), b: Math.max(0, Math.ceil(st.idle_unload_minutes - used))});
  }
  return t("已接上 · 模型 {m} · ", {m: st.model || "?"})
       + (st.loaded ? t("已加载") + idle : t("还没加载（第一次播报要等十几秒）"))
       + t(" · 服务当前音色 {v}", {v: st.speaker || "?"});
}

/* 全退出：**先收外挂，再关自己**（顺序在服务端保证，见 /api/quit）——
   仪表盘一没，就没人去收那个吃显存的进程了。 */

    await api("/api/quit", {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"});
  }catch(e){
    // 它退的时候这条连接会断——那正是"它乖乖退了"的动静，不是错误
  }

}

/* 试听：**用表单里当前的值**（没保存也能先听），念一句固定的样句。
   为什么固定样句：定音色要听的是"这个嗓子念这话什么动静"，不是听内容——
   内容一样，才比得出来。样句跟着界面语言走（英文模式听英文）。 */
function voiceSample(){
  return LANG === "en"
    ? "Hey, I'm here. How was your day? Take your time with that thing earlier — I'm listening."
    : "嗯，我在。今天过得怎么样？刚才那件事你慢慢说，我听着。";
}
async function tryVoice(){
  // 用**表单里当前的值**（还没保存也能先听）——这是"拖一拖听听什么动静"的唯一办法
  const f = readVoiceForm();
  const out = $("voiceOut");
  const show = (msg) => { if(out) out.textContent = msg; };
  stopSpeak();                       // 试听不叠在正在念的那条上
  show(t("试听中…"));
  const got = await speakStreaming(null, voiceSample(), {speaker: f.speaker, dims: f.dims,
                                                         instruct_extra: f.extra});
  if(got.ok){ show(t("在放了（这一段就是 {p} 接下来每句的嗓子）")); return; }
  if(got.error){ show(t("放不出来：") + got.error); return; }
  try{                               // 流式这条路用不了：退回整段（同 speak 那条退路）
    const d = await api("/api/speak", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({text: voiceSample(),
                            speaker: f.speaker, dims: f.dims, instruct_extra: f.extra})});
    if(!d.ok){ show(t("放不出来：") + (d.detail || t("没接上语音服务"))); return; }
    const a = new Audio(d.audio);
    speakAudio = a;
    a.onended = a.onerror = () => stopSpeak();
    await a.play();
    show(t("在放了（这一段就是 {p} 接下来每句的嗓子）"));
  }catch(e){ show(t("放不出来：") + e.message); }
}

let distillTimer = 0;
// 整理期间自动轮询：整理完要自己刷新一下，否则「整理中…」会一直挂着，
// 用户会以为卡住了，然后反复点「新对话」（越点越乱）。
function watchDistill(on){
  if(on && !distillTimer) distillTimer = setInterval(refreshAll, 2500);
  if(!on && distillTimer){ clearInterval(distillTimer); distillTimer = 0; }
}
/* 外部服务灯的判据（2026-09-25）：**看真实的最后一次调用**，不看"配了没有"——
   原来只判配置，向量服务死了两天勾还亮着（后端 `_service_status` 的理由）。
   四态：**未配**（没填齐）/ **未测试**（填齐了但一次都没调用过——完全中性：
   既不说能用，也不说不能用）/ **✓**（最近一次成功）/ **✗**（最近一次失败，
   红，悬停给时间与原因）。 */
/* 只列后端真会记的码：`_note_err` 对 HTTP 只按状态码分档、**不读响应体**
   （体是一次性的，读了降级判据就瞎了）——所以没有 `too_long` 那种要读体才有的码 */
const SVC_ERR = {auth:"key 不对（401）", rate:"被限流（429）",
                 timeout:"超时", network:"连不上", other:"失败"};
function svcErrText(code){
  if(!code) return "";
  if(SVC_ERR[code]) return t(SVC_ERR[code]);
  // 语义服务存的是异常原文（"连不上 / 超时"那类话就写在里面）——截断原样给
  return /^http_/.test(code) ? ("HTTP " + code.slice(5)) : code.slice(0, 60);
}
function svcPill(el, name, st){
  st = st || {};
  let cls = "on", text = t(name + " ✓"), tip = "";
  if(!st.available){
    cls = "off"; text = t(name + " 未配");
  }else if(st.ok === false){
    cls = "bad"; text = t(name + " ✗");
    tip = t("最近失败 {t}（{e}）",
            {t: (st.last_err_at || "").slice(5, 16),
             e: svcErrText(st.last_error) || t("失败")});
  }else if(st.ok === null){
    cls = "off"; text = t(name + " 未测试");
    tip = t("还没调用过——配置在，第一次对话就会验证它");
  }else{
    tip = t("最近成功 {t}", {t: (st.last_ok_at || "").slice(5, 16)});
  }
  el.textContent = text;
  el.className = "pill " + cls;
  el.title = tip;
}
async function refreshHeader(){
  try{
    const s = await api("/api/state");
    // 拖入的上限从 config 来（`/api/state` 带过来），页面里不抄一份
    INPUT_MAX = (s.input && s.input.file_max_chars) || INPUT_MAX;
    LONG_CHARS = (s.input && s.input.long_chars) || LONG_CHARS;
    const c = s.counts;
    $("hCounts").innerHTML =
      t("场景 <b>{n}</b> · 原文 <b>{d}</b> 天 · 摘要 <b>{s}</b> · 画像 <b>{p}</b> · 备忘录 <b>{o}</b> · 实体 <b>{e}</b>",
        {n: c.scenes, d: c.raw_docs, s: c.summaries, p: c.profiles, o: c.memos, e: c.entities})
      + (c.archived ? t(" · 冷层 <b>{n}</b>", {n: c.archived}) : "");
    // 两个服务灯：判据是后端记的**真实调用结果**（`_service_status`），
    // 不是"配置填了没有"——服务死了两天勾还亮着的教训（2026-09-25）
    svcPill($("hVec"), "语义", s.vector);
    svcPill($("hLLM"), "模型", s.llm);
    const hd = $("hDistill");
    hd.style.display = s.distilling ? "" : "none";
    hd.textContent = t("整理中…");

    watchDistill(s.distilling);

    // 以前没人读它；窗口渲染的开销很小，而它是"air 上下文里有什么"的另一半答案）
    const wwin = $("wakeWindow");

        : "";

  }catch(e){ $("hCounts").textContent = t("状态读取失败：") + e.message; }

/* ---------- 备忘录（对话右侧，随手划） ---------- */
// 2026-09-21（设计稿 D 条 4）：她判（`close_memo` 工具）+ 他随手划（这里），
// 系统兜底（**超期退役**，2026-10-05 起）。面板常驻右列（histAside）顶部——**默认收起只占一行**，
// 点开是全列（不只列到期的），每条一个「划掉」。
// 窄屏没有右列：面板随 histAside 一起不可见（同右列的其它内容，见 loadHistory）。
let memoPanel = null;      // 面板元素（clearChat 会清空 histAside——靠引用重挂）
let memosOpen = false;     // 展开态（不持久化：刷新回默认，同 asideBtn 的规矩）
let memoData = [];         // 最近一次拉到的全列（划掉后用后端回的列表覆盖）

function mountMemoPanel(){
  if(!memoPanel){
    memoPanel = document.createElement("div");
    memoPanel.id = "memoSec";
    memoPanel.innerHTML = `<div class="mh" onclick="toggleMemos()">`
      + `<span id="memoHead"></span><span class="chev">▼</span></div>`
      + `<div class="mb" id="memoBody"></div>`;
  }
  // 总是挂回顶部：clearChat 清过 histAside，节点要靠引用重挂。
  // 「收起右列」不动它——收起就是收起，右列内容留在右列（见 toggleAside）。
  const aside = $("histAside");
  if(memoPanel.parentNode !== aside) aside.insertBefore(memoPanel, aside.firstChild);
}
/* 把备忘录按组聚拢（2026-09-22）：同组名的挨在一起、保持原顺序；
   没组名的各自成组（name 为空 → 不渲染组头）。 */
function memoGroups(list){
  const groups = [], byName = {};
  (list||[]).forEach(m => {
    const g = (m.group_name || "").trim();
    const key = g || `__${m.id}`;            // 无组名：各自一组
    if(!byName[key]){ byName[key] = {name: g, items: []}; groups.push(byName[key]); }
    byName[key].items.push(m);
  });
  return groups;
}
function toggleMemos(){ memosOpen = !memosOpen; renderMemoPanel(); }
function renderMemoPanel(){
  if(!memoPanel) return;
  // 0 条：整块摘掉（不占地方，也保住 `#histAside:empty` 的旧语义——
  // 没有历史也没有备忘录时，右列照旧整个不显示）
  if(!memoData.length){ memoPanel.remove(); return; }
  mountMemoPanel();          // 挂在最前（重挂是幂等的）
  memoPanel.classList.toggle("open", memosOpen);
  $("memoHead").textContent = memosOpen
    ? t("备忘录 · {n} 件（点收起）", {n: memoData.length})
    : t("备忘录 · {n} 件（点开划掉）", {n: memoData.length});
  if(!memosOpen) return;
  const kindZh = {"user_task": t("用户说的事"), "air_promise": t("你答应的事")};
  // 按组渲染（2026-09-22）：同一件事的多步挂在一个组头下、步骤缩进一层；
  // 划掉仍是划单条——**「哪个了结划掉哪个」**（组只用于聚合显示）。
  $("memoBody").innerHTML = memoGroups(memoData).map(grp => {
    const rows = grp.items.map(m => {
      const due = m.due_now ? ` <span class="due">· ${t("到期")}</span>` : "";
      return `<div class="mi${grp.name?" sub":""}"><div class="mx">`
        + `<span class="mid">${esc(m.id)}</span>${esc(kindZh[m.kind] || "")}${due}<br>${esc(m.content)}`
        + `</div><button class="ghost" onclick="closeMemo('${esc(m.id)}')">${t("划掉")}</button></div>`;
    }).join("");
    const head = grp.name
      ? `<div class="mg">${esc(grp.name)}　·　${t("{n} 步", {n: grp.items.length})}</div>` : "";
    return head + rows;
  }).join("");
}
async function refreshMemos(){
  try{
    memoData = (await api("/api/memos")) || [];
    mountMemoPanel();
    renderMemoPanel();
  }catch(e){ /* 面板读不到不该拦界面 */ }
}
async function closeMemo(id){
  try{
    const out = await api("/api/memo-close", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify({id})});
    if(out.memos) memoData = out.memos;     // 后端回的是刷新后的全列
    if(!out.ok) alert(t("划不掉：") + (out.detail || ""));
    renderMemoPanel();
    // 左侧「备忘录」页开着就一起刷（同一个人发动作的第三个入口：右侧面板 / 左侧表格 / 她调工具）
    if(activeTab === "备忘录") refreshPanel();
  }catch(e){ alert(t("划不掉：") + e.message); }
}

/* ---------- 拖入文件（**人拉进来的**，不是 air 去读的） ---------- */
// 设计稿：工具箱第十二节。**读文件的是浏览器，不是 air**——air 收到的永远只是一条
// 普通消息，甚至不知道这段是文件还是打字。
// 三个"不"：不自动发送、不加标注前缀、不走特殊通道。

// 上限从 `/api/state` 拿（真值在 config 里）；这两个只是它还没回来时的兜底。
let INPUT_MAX = 20000;
let LONG_CHARS = 6000;

// 拖进来的文件**先是一个待发的附件**（保持"文件的样子"），不是一坨文字。
// 发送时才把内容并进消息——**进了对话它就是一条普通消息**，没有特例。
let attachment = null;

function renderAttach(){
  const bar = $("attachBar");
  if(!attachment){ bar.style.display = "none"; bar.innerHTML = ""; return; }
  const n = attachment.text.length;
  const warn = n > LONG_CHARS
    ? ` <span class="warn">${t("（偏长，{p} 可能接不住——可以只留下要问的那部分）")}</span>` : "";
  bar.style.display = "block";
  bar.innerHTML = `<div class="att"><span class="nm">${esc(attachment.name)} · ${t("{n} 字", {n})}${warn}</span>`
    + `<button class="ghost" onclick="editAttachment()" title="${t("放进输入框，就能看、能改")}">${t("展开改写")}</button>`
    + `<button class="ghost" onclick="clearAttachment()">${t("移除")}</button></div>`;
}

function clearAttachment(){ attachment = null; renderAttach(); }

/* 输入框随内容长高。封顶值**只在 CSS 里写一处**（`#input` 的 max-height）：
   这里只把真实内容高度报给 style.height，超出时 max-height 把它钳住、
   overflow-y 出滚动条。`height:auto` 一步是为了**缩回去**——不先清掉上一次
   的 inline 高度，删字后它不会变矮。 */
function fitInput(){
  const box = $("input");
  box.style.height = "auto";
  /* +2 = 上下边框：scrollHeight 不含 border，border-box 的 height 含；
     不加的话内容区少 2px，底部会挂一条 1-2px 的滚动位（碰整数行的余量
     能遮住，但那是在碰运气）。 */
  box.style.height = (box.scrollHeight + 2) + "px";
}

function editAttachment(){
  // 想细看 / 想删掉一部分 → 放回输入框。**这时它就只是文字了**，附件状态消失。
  if(!attachment) return;
  const box = $("input");
  box.value = (box.value.trim() ? box.value.replace(/\s+$/, "") + "\n\n" : "") + attachment.text;
  clearAttachment();
  box.focus();
  fitInput();
}

// 拖到页面**任何**地方都别让浏览器直接打开它——那会把整页导航走，
// 这段对话就没了。这是保护，不是功能。
["dragover", "drop"].forEach(ev =>
  window.addEventListener(ev, e => e.preventDefault()));

const TEXT_EXT = /\.(txt|md|markdown|json|csv|log|py|js|ts|html|css|xml|yml|yaml|ini|conf|sh|sql|tex)$/i;

function looksText(f){
  if(TEXT_EXT.test(f.name)) return true;
  if(f.type && f.type.startsWith("text/")) return true;
  return !/\.[a-z0-9]{1,6}$/i.test(f.name);      // 没扩展名：当纯文本试
}

async function dropFiles(e){
  const box = $("input");
  box.classList.remove("dropping");
  const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []);
  if(!files.length) return;
  if(files.length > 1)
    bubble("sys", "系统", t("一次只收一个文件——先用第一个（{name}）。", {name: files[0].name}));
  const f = files[0];

  if(f.type && f.type.startsWith("image/")){
    bubble("sys", "系统", t("{p} 看不了图（没有多模态）。要给 {p} 看，就贴成文字。"));
    return;
  }
  // docx / pdf 现在不做（设计稿 12.2）：docx 是 zip+XML，浏览器原生能做，
  // 但先验证「拖入」这条交互本身；这两类的旁路是"另存为 txt 再拖"。
  if(/\.(docx?|pdf)$/i.test(f.name)){
    bubble("sys", "系统", t("{name} 现在读不了——用 Word「另存为」存成 txt 或 md 再拖进来就行。", {name: f.name}));
    return;
  }
  if(!looksText(f)){
    bubble("sys", "系统", t("{name} 不像文本文件，没读。", {name: f.name}));
    return;
  }

  let text = "";
  try{
    text = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result || ""));
      r.onerror = () => rej(r.error || new Error("读不了"));
      r.readAsText(f, "utf-8");
    });
  }catch(err){
    bubble("sys", "系统", t("{name} 没读成：{why}", {name: f.name, why: err.message}));
    return;
  }
  // 替换字符 = 编码不对。**说出来，而不是默默塞一堆乱码给他**
  if(text.includes("\uFFFD")){
    bubble("sys", "系统", t("{name} 读出来是乱码，它大概不是 UTF-8——另存成 UTF-8 再拖一次。", {name: f.name}));
    return;
  }

  let note = "";
  if(text.length > INPUT_MAX){
    text = text.slice(0, INPUT_MAX);
    note = t("，太长就取了前 {n} 字（可以在这里删掉不要的部分）", {n: INPUT_MAX});
  }
  // **原样收下**：不加「来自 x.md」这类前缀——进记忆时这条消息的来源只有一个，
  // 就是他。但先以**附件**的样子待着，不把整篇摊进输入框。
  attachment = {name: f.name, text: text};
  renderAttach();
  bubble("sys", "系统", t("已收下 {name}（{n} 字）{note}——发送时会一起发过去；想先改就点「展开改写」。",
    {name: f.name, n: text.length, note}));
}

/* ---------- 启动 ---------- */
// 输入法合成**结束**的时刻（Esc 那条保险用，见下面 keydown 里的说明）。
let compEndAt = 0;
$("input").addEventListener("compositionend", () => { compEndAt = Date.now(); });
$("input").addEventListener("keydown", (e) => {
  // ⚠️ **输入法合成中一律不管**（2026-10-07 补）：中文输入法用 Enter 选词、按 Esc
  // 取消候选，浏览器照样发 keydown（`isComposing` 为真；老浏览器 `keyCode` 是 229）。
  // 不挡的话：选词那一下会把**半截话直接发出去**，而 Esc 取消候选会把输入框
  // **整条清空**（`endEdit(true)`）——两个都是丢字。
  if(e.isComposing || e.keyCode === 229) return;
  // 取消候选那一下还有一层浏览器差异：有些浏览器里 Esc 的 keydown **晚于**
  // `compositionend` 才发（那时 `isComposing` 已经是 false）——只看上面那条，
  // 它会被当成"取消编辑"。刚合成完的这一小段里 Esc 一律不管：**误吞的代价只是
  // 再按一次，误清的代价是整段草稿没了**（不对称，所以宁可不认这一下）。
  if(e.key === "Escape" && Date.now() - compEndAt < 120) return;
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
  // Esc 退出编辑态（同 ai-chatbot 的 `handleCancelEditMouseDown` 那条键位）
  if(e.key === "Escape" && editingTurn){ e.preventDefault(); endEdit(true); }
});
// 打字 / 粘贴都过这里：输入框随内容长高（封顶与滚动见 #input 的 CSS）
$("input").addEventListener("input", fitInput);
// 窗口 / 侧栏尺寸一变，已有文本的折行数就变了（同样的字，窄了多折几行）——
// 高度得跟着重算，否则窄了最后几行会被截住。空框不碰：fitInput 会把空框
// 设成一个有零头的 inline 高度，空框应当保持 CSS 给的 46px。
window.addEventListener("resize", () => { if($("input").value) fitInput(); });
["dragenter", "dragover"].forEach(ev =>
  $("input").addEventListener(ev, () => $("input").classList.add("dropping")));
$("input").addEventListener("dragleave", () => $("input").classList.remove("dropping"));
$("input").addEventListener("drop", dropFiles);

/* ---------- 人格：和谁聊（air / mia / xina） ---------- */
// 选项列表从后端来（扫 self/personas/，加一个 md 即多一个选项）；
// 切换 = 一次 POST，**下一句生效**——对话每轮现读人格（chat.load_persona）。
// id 是小写英文文件名（会写进原文署名）；下拉里显示的是**人格文件首行**那个名字
// （中文也行，2026-10-05）——跟在后面的注释是出厂三位的路子，新人格没有注释。
// 「名字从哪来」只有一处：文件的 `# 首行`（后端解析，页面只显示）。
const PERSONA_LABEL = {air: "air", mia: "mia", xina: "xina"};
const PERSONA_NOTE = {air: "共情、温暖", mia: "轻松、灵动", xina: "诚实、严谨"};
/* 显示名（文件首行 `# xxx`）由后端随 `/api/persona` 下发，**页面里不抄一份**——
   人格文件是他能新建 / 能改的东西，页面钉死名字就会和文件漂开（2026-10-05）。
   下面是出厂三位的兜底：拿不到后端时（接口挂了）至少名字还在。 */
function personaText(n){
  const label = PERSONA_LABEL[n] || n;
  const base = label === n ? label : `${label}（${n}）`;   // 自定名后面跟 id，看得清是谁
  const note = PERSONA_NOTE[n];
  if(!note) return base;   // 以后新增人格：只有名字（注释是逐个人格写的）
  return LANG === "en" ? `${base} (${t(note)})` : `${base}（${t(note)}）`;
}
async function loadPersona(){
  try{
    const d = await api("/api/persona");
    CUR_PERSONA = d.persona || "air";     // 界面所有 {p} 文案跟着它走
    (d.items || []).forEach(it => {       // 显示名跟文件走
      if(it && it.id && it.display) PERSONA_LABEL[it.id] = it.display;
    });
    const sel = $("personaSel");
    sel.innerHTML = (d.names || ["air"]).map(n =>
      `<option value="${esc(n)}"${n === d.persona ? " selected" : ""}>${esc(personaText(n))}</option>`
    ).join("");
  }catch(e){ /* 拉不到先空着——不拦别的渲染 */ }
}
$("personaSel").addEventListener("change", async (e) => {
  const name = e.target.value;
  try{
    const d = await api("/api/persona", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify({persona: name})});
    CUR_PERSONA = d.persona || name;      // 先换名：下面的提示与重刷都用新的
    bubble("sys", "系统", t("已切到「{name}」——下一句起，说话的就是 {p}。",
      {name: PERSONA_LABEL[d.persona] || d.persona}));
    paintStatic();      // 静态文案（data-t 里的 {p}）重刷
    refreshAll();       // 面板说明也跟着换名
  }catch(err){ alert(t("切换失败：") + err.message); loadPersona(); }
});

/* **先定语言、再渲染**：所有渲染函数都依赖 LANG 已经对了（中文原文是 key）。
   拿不到语言就兜底中文——这是本地服务，失败极少见，而失败不该拦界面。 */
async function boot(){
  try{
    const s = await api("/api/state");
    if(s.lang === "en" || s.lang === "zh") LANG = s.lang;
  }catch(e){ /* 兜底中文 */ }
  document.documentElement.lang = LANG === "en" ? "en" : "zh-CN";
  document.title = t("air-link-01 · 记忆实验台");
  // 宽屏：对话右侧给「更早的对话」让一列（阈值与 CSS 的 body.wide 一致）。
  // 判定一次就够：内容渲染进哪边是启动时定死的——缩窗口不搬家，刷新重判。
  document.body.classList.toggle("wide", matchMedia("(min-width:1200px)").matches);
  paintStatic();
  renderTabs();
  refreshAll();
  renderSpeakToggle();
  renderAsideBtn();
  loadPersona();
  refreshVoicePower();
  setInterval(refreshVoicePower, 30000);   // 低频校准：别处起/关过服务时，顶栏按钮也跟上
}
// 存下 promise：下面的历史回填要等**语言定完**再渲染（见调用处说明）
const bootP = boot();

/* ---------- 重启/刷新后回填对话区 ---------- */
// 窗口里的对话（还没进长期库的那一段 + 压缩摘要）存在服务端文件里，
// **每次变化都会落盘**——但页面从来没拉过它，所以一重启对话区就是空的
// （数据在、界面没了，看起来像"air 把刚才聊的忘了"）。这里把它拉回来。
// （原来这里记一个"回填到哪一刻"的水位给留言去重用——留言那条路
//   2026-10-05 晚整块删了，水位也跟着删：没有第二个消费方。）
async function loadHistory(){
  try{ renderHistory(await api("/api/history")); }
  catch(e){ /* 历史读不到不影响新对话 */ }
}

/* 把一份 `/api/history` 画到屏幕上。**它只管画、不负责擦**——两处调用都先清干净
   （`clearChat`：`#msgs` / `#histAside` / 轮次栈三样都收）：启动那次是空容器，
   `resyncChat` 那次得自己先收（不然记录会叠一份）。 */
function renderHistory(h){
  try{
    const msgs = h.messages || [], digest = h.digest || [], raws = h.raws || [];
    if(!msgs.length && !digest.length && !raws.length) return;
    // 宽屏时右侧栏（#histAside）只住**压缩摘要**（+唤醒，见 CSS）——
    // 对话区中间的"历史记录"（原文段）**留在中间**，记录不该离开主列。
    // （2026-09-20 踩过：整块搬右列后中间只剩分隔线。）
    const wide = document.body.classList.contains("wide");
    const hist = wide ? $("histAside") : $("msgs");
    // 已提取的原文（最近几段）——「重启后记录没了」正落在这里：
    // 窗口一提取就清空，但原文还在（raws），按段摊开就是记录本身。
    // **留在对话区中间**：这是"历史对话记录"本尊，右列只住摘要与唤醒。
    if(raws.length){
      const head = document.createElement("div");
      head.className = "m sys";
      head.innerHTML = `<div class="bubble">${t("—— 更早的对话（原文 · 已进长期库）——")}</div>`;
      $("msgs").appendChild(head);
      raws.forEach(r => {
        const sep = document.createElement("div");
        sep.className = "m sys";
        sep.innerHTML = `<div class="bubble">${esc(r.id || "")} · ${esc((r.time || "").slice(5, 16))}</div>`;
        $("msgs").appendChild(sep);
        (r.messages || []).forEach(m => {
          const isUser = (m.speaker || "user") === "user";
          // 署名用**当时的真名**（原文里是谁说的，2026-09-21）：切了人格看旧记录，
          // 显示的是说那句话的人，不是当前这个人；旧原文没有 persona → 回退 air
          // （与后端 `render_conversation` / `gist_line` 同一口径）。
          const who = isUser ? t("你") : (m.persona || "air");
          const d = document.createElement("div");
          d.className = "m " + (isUser ? "user" : "air");
          d.innerHTML = `<div class="who">${esc(who)}</div>`
            + `<div class="bubble"><div class="txt">${md((m.text || "").trim())}</div></div>`;
          // **原文才是"这条消息的文本"**：屏幕上那份过了 `md()`（`**粗体**` 与
          // 反引号被渲染掉了），拿它当原文会**复制出一条被改过的消息**——
          // 复制 / 朗读 / 编辑 / 重新生成都取 `_text`（见 `bubbleText`）。
          d._text = m.text || "";
          $("msgs").appendChild(d);
          // 已进长期库的这段**只有复制和朗读**：「编辑 / 重新生成」只挂在**窗口里**
          // 那些轮次上（见 `bindLastTurn` 与下面窗口那一段的回填）——改它们要撤掉整轮，
          // 而它们早就被提取走了（撤不掉，所以不给按钮）。
          const row = msgActions(d, () => bubbleText(d));
          if(!isUser) addSpeakBtn(row, d);
        });
      });
    }
    if(digest.length){
      // 压缩摘要：宽屏住右列（摘要批那一坨就是从这里搬走的）；窄屏照旧在对话区。
      if(wide){
        const head = document.createElement("div");
        head.className = "as-head";
        head.textContent = t("压缩摘要");
        const note = document.createElement("div");
        note.className = "as-note";
        note.textContent = t("已进长期库。全文在「打捞」，结构化记忆在「场景」。");
        hist.appendChild(head);
        hist.appendChild(note);
        digest.forEach(x => {
          const box = document.createElement("div");
          box.className = "doc";
          const bar = document.createElement("span");
          bar.className = "docbar";
          bar.textContent = t("摘要批（点开看）");
          const body = document.createElement("div");
          body.className = "doctext";
          body.textContent = x;
          box.appendChild(bar);
          box.appendChild(body);
          box.addEventListener("click", () => box.classList.toggle("open"));
          hist.appendChild(box);
        });
      }else{
        const d = document.createElement("div");
        d.className = "m sys";
        d.innerHTML = `<div class="who">${t("更早的对话（压缩摘要）")}</div><div class="bubble">`
          + digest.map(x => `<div class="doc" onclick="this.classList.toggle('open')">`
              + `<span class="docbar">${t("摘要批（点开看）")}</span>`
              + `<div class="doctext">${esc(x)}</div></div>`).join("")
          + `</div>`;
        hist.appendChild(d);
      }
    }
    // 窗口里的每一轮都要入栈（**不只最后一条**，2026-10-07 放宽）：它们都还在
    // 窗口里，都撤得掉。按「他一句 + 她回的那些」成对收——末尾只有他一句
    // （她还没回 / 被叫停到没说话）时，air 那头给 null。
    let winUser = null;
    msgs.forEach(m => {
      const isUser = (m.speaker || "user") === "user";
      // 窗口里的署名同样认 `persona`（这条是谁说的，不是"现在是谁"）——
      // 旧的（没这个字段）回退 "air"：那是加字段之前的残留，而当时就是 air 在说
      // （与后端 `render_conversation` / 原文回填同一口径）
      const who = isUser ? t("你") : (m.persona || "air");
      const d = document.createElement("div");
      d.className = "m " + (isUser ? "user" : "air");
      d.innerHTML = `<div class="who">${esc(who)}`
        + `<span style="margin-left:8px;opacity:.65">${esc((m.ts || "").slice(5, 16))}</span></div>`
        + `<div class="bubble"><div class="txt">${md(m.text || "")}</div></div>`;
      // ⚠️ **这条不能省**（2026-10-07 补）：屏幕上那份过了 `md()`，`**粗体**` 与
      // 反引号都被渲染掉了——`bubbleText` 于是回退去读 DOM，**重新生成 / 编辑
      // 会拿一条被改过的文本重发**（改编辑那条最阴：他点了保存，落进窗口的
      // 是一句他没说过的话）。留 `_text` = 窗口里存的那份原文。
      d._text = m.text || "";
      $("msgs").appendChild(d);
      // 说到一半被叫停的那句（`interrupted` 是窗口里落下的字段）：
      // **刷新前后都要标同一个「（已停止）」**——不然回填后看的人分不清
      // "她说完了"和"被叫停了"（标记只加在署名后，正文一个字不动）。
      if(m.interrupted) markStopped(d);
      const row = msgActions(d, () => bubbleText(d));
      if(!isUser) addSpeakBtn(row, d);
      // 成对入栈：见到新的一句就把上一轮收口（她的回话可能不止一条——被叫停那条
      // 也算这一轮的产物，所以取**最后一条 air**）
      if(isUser){
        if(winUser) pushTurn(winUser.el, winUser.air);
        winUser = {el: d, air: null};
      } else if(winUser){
        winUser.air = d;
      }
    });
    if(winUser) pushTurn(winUser.el, winUser.air);
    // 上面那段"原文"里的消息早就进长期库了，没得撤——所以它们没有按钮。
    $("msgs").scrollTop = $("msgs").scrollHeight;
  }catch(e){ /* 画不出来不该拦界面 */ }
}

/* ---------- 屏幕与窗口对不上时的收口：**不猜，去问** ---------- */
/* 有一类失败，客户端**分不清**这一轮在窗口里长什么样：撤销请求断在半路（撤没撤？）、
   流断在半路（她半句落没落？）。分不清就不许按猜的摆屏幕——"看着改了、其实没改"
   那类错位就是这么来的。`/api/history` 的 `messages` 就是窗口逐字那一份：拉回来
   照着重画一遍，屏幕即窗口。

   `text`：这一轮他说的那句——拿它判"窗口里到底有没有这一轮"（见 `windowHasTail`），
   只有**没有**才退回输入框：有的话它已经在屏幕上（还带着铅笔 / 弯箭头），
   再塞回输入框等于让人白说一遍。
   `why`：给用户的一句交代（各条路的说法不同：撤不成 / 断在半路 …）。

   **先拉到、再清屏**：拉不到就一个字都不动——同一个网络故障里"先清后拉"会把
   对话区清空，那比错位更难收拾。 */
async function resyncChat(text, why){
  let h = null;
  try{ h = await api("/api/history"); }catch(e){ h = null; }
  if(h === null){
    if(text){ const box = $("input"); box.value = text; fitInput(); box.focus(); }
    bubble("sys", "系统", t("（{w}，也读不到服务端的现状——刷新一下页面看真实情况）", {w: why}));
    return;
  }
  clearChat();
  renderHistory(h);
  if(text && !windowHasTail(h, text)){
    const box = $("input"); box.value = text; fitInput(); box.focus();
  }
  bubble("sys", "系统", t("（{w}——已按服务端的现状把这一段重新对上）", {w: why}));
}

/* 窗口末尾是不是**他说的这一句**：判"这一轮到底落进窗口没有"。
   从末尾往回扫过她的回话（她可能没说、也可能只说了半句），落到最近的一条用户
   消息上再比——它就是他说的上一句。 */
function windowHasTail(h, text){
  const msgs = ((h || {}).messages) || [];
  let i = msgs.length - 1;
  while(i >= 0 && (msgs[i].speaker || "user") !== "user") i--;
  if(i < 0) return false;
  return ((msgs[i].text || "").trim()) === (text || "").trim();
}

// 抢跑会闪一段中文（两个请求同时发，谁先回来不定）。
// （原来这里还接一支 `pollOpenings`「看她有没有留言」——2026-10-05 晚
//   主动开口整块删了，留言面板与轮询一起撤，见待优化稿 K 条。）
// （原来末尾还发一条"记忆实验台已就绪"系统消息——每次刷新都冒一条、
//   对天天用的人没有信息量，2026-09-20 删了：系统的状态由界面自己表达。）
bootP.then(() => loadHistory());
