<!doctype html>
<!--
air-link-01 的仪表盘页面（整个前端就这一个文件）。
后端是 `core/dashboard.py`：这里的每个 `api(...)` 都对着那边两张路由表
（见 `do_GET` / `do_POST` 的 docstring）。**改接口时两边一起改。**

分三段：
  一、样式（<style>）   老纸色：暖、低对比、久看不累，见 `:root`。
  二、骨架（<body>）    只有对话区的常驻结构，其余视图由脚本填、互相覆盖（不翻页）。
  三、脚本（<script>）  文案与工具 → 气泡/确认条 → 说话与流式 → 唤醒面板 →
                        各视图（viewScenes / viewMirror / viewSettings …）→
                        顶部轮询（refreshHeader / boot）→ 语音播报 → 拖入文件

三条约定：
  1. 不抄后端的常量——档位名、档案键、输入上限都由接口一起给回来。
  2. 只读走 GET；会改东西的（改 / 删 / 否决 / 合并）全走 POST。
  3. 失败要在界面上留一句，不能只 `console.log`——用户看不见控制台。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>air-link-01 · 记忆实验台</title>
<style>
  /* 旧纸色：暖、低对比、久看不累。
     为什么不用深色：这是「看自己」的地方，不是终端。
     参照的是纸和墨的关系——背景像纸，文字像墨，强调用暗红棕（印章色）。*/
  :root{
    --bg:#f2ece0;        /* 纸 */
    --panel:#faf6ec;     /* 亮一点的纸（侧栏 / 卡片） */
    --panel2:#eae2d1;    /* 压下去的纸（悬停 / 次级块） */
    --line:#ded4c0;      /* 界线：比纸深一点就够，别用黑 */
    --fg:#34302a;        /* 墨 */
    --dim:#8b8271;       /* 淡墨 */
    --acc:#8a6a3c;       /* 印章色（暖棕） */
    --ok:#5f7a4a; --warn:#a2741f; --bad:#a8543f; --sen:#7a5a9a;
    --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--fg);
    font:14.5px/1.65 system-ui,-apple-system,"Microsoft YaHei",sans-serif;
    display:grid; grid-template-rows:auto 1fr; overflow:hidden;
  }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#d9cfba;border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#cbbfa5}
  ::-webkit-scrollbar-track{background:transparent}

  header{
    display:flex; align-items:center; gap:12px; padding:10px 16px;
    border-bottom:1px solid var(--line); background:var(--panel);
  }
  header h1{font-size:14.5px;margin:0;font-weight:600;letter-spacing:.3px}
  header .stat{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
  header .stat b{color:var(--fg);font-weight:600}
  header .spacer{flex:1}
  .pill{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--dim)}
  .pill.on{color:var(--ok);border-color:#c3d3b4}
  .pill.off{color:var(--warn);border-color:#ddc9a0}
  /* 服务灯红档（2026-09-25）：最近一次调用失败——"配置在但用不了"要看得出来 */
  .pill.bad{color:var(--bad);border-color:#ddbdb4}
  /* 人格选择器（和谁聊）：顶栏里的一小块，样式随 pill */
  #personaSel{font-size:11.5px;padding:3px 6px;border-radius:10px;border:1px solid var(--line);
              background:transparent;color:var(--fg);cursor:pointer}
  #personaSel:focus{outline:none;border-color:#c9b893}

  /* 收起侧栏 = **改成单列**，不是把第一列压成 0。
     压成 0 会坏：#side 一旦 `display:none` 就不再是 grid item，
     #stage 会自动补到第一列（宽 0），整个对话区就塌到左边去了（真踩过）。
     单列时 #stage 是唯一参与布局的项，自然占满。 */
  main{display:grid;grid-template-columns:190px 1fr;min-height:0}
  main.nav-hidden{grid-template-columns:1fr}
  main.nav-hidden #side{display:none}

  /* ---- 左侧导航（原来是底部标签栏，横排挤不下、也抢焦点） ---- */
  #side{overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:10px 8px}
  #side .grp{font-size:11px;color:var(--dim);padding:10px 12px 4px;letter-spacing:.5px}
  #side button{
    display:block;width:100%;text-align:left;background:transparent;border:0;
    border-radius:8px;padding:8px 12px;color:var(--dim);font-size:13.5px;margin-bottom:1px;
  }
  #side button:hover{background:var(--panel2);color:var(--fg)}
  #side button.active{background:#e9e0cc;color:var(--fg);font-weight:600}

  #stage{min-height:0;display:grid}
  #chatView{display:grid;grid-template-rows:1fr auto auto;min-height:0}
  #chatView, #panelView{grid-area:1/1}

  /* ---- 右侧栏（宽屏右列）：唤醒 + 更早的对话 ----
     宽屏时对话右侧多一列：顶上住唤醒（这一轮想起了什么），下面住历史回填
     （已提取原文 / 压缩摘要）——对话主流只留窗口里还热乎的往来。
     消息列 720 居中、两边本来就有留白，那片空白正好安置这些。
     开关只有一个：boot 按 1200px 判一次、加在 body.wide 上
     （内容渲染进哪边是启动时定的——缩窗口不搬家，刷新重判）。
     窄屏没有这一列，唤醒条与历史回填全部照旧（下面一条规则都不生效）。 */
  #histAside{display:none}
  body.wide #chatView{grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:auto 1fr auto}
  /* 收起右列（顶栏的「收起」钮）：与 ☰ 收左侧同一规矩——**收成单列**，
     不是把列压成 0（见 `main.nav-hidden` 的注释，那边踩过）。 */
  body.wide.aside-hidden #chatView{grid-template-columns:1fr}
  body.wide.aside-hidden #wakeWrap,
  body.wide.aside-hidden #histAside{display:none}
  /* 窄屏没有右列，开关不出现（免得点了没反应） */
  body:not(.wide) #asideBtn{display:none}
  body.wide #msgs{grid-column:1;grid-row:1/span 2}
  body.wide #composerWrap{grid-column:1;grid-row:3}
  body.wide #wakeWrap{
    grid-column:2;grid-row:1;border-top:0;border-left:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  body.wide #wakeBar{max-width:none;margin:0;padding:9px 14px}
  body.wide #wakeBody{padding:12px 14px 14px}
  body.wide #wakeBody .box{max-width:none;margin:0 0 10px}
  body.wide #histAside{
    display:block;grid-column:2;grid-row:2/span 2;
    box-sizing:border-box;overflow-y:auto;background:var(--panel);
    border-left:1px solid var(--line);padding:14px 14px 20px;
  }
  body.wide #histAside:empty{display:none}
  /* as-*：「更早的对话」的小标题/注脚——**不挂容器**（历史遗留：早先收起右列
     时会把这些节点搬进对话区，故自带 720 中轴；2026-09-21 起收起不再搬家，
     见 toggleAside——保留 max-width 无害，别删，万一又想搬）。 */
  .as-head{font-size:12px;font-weight:600;color:var(--dim);letter-spacing:.3px;max-width:720px;margin:0 auto}
  .as-note{font-size:11px;color:var(--dim);opacity:.8;margin:2px auto 12px;max-width:720px}
  .as-sec{font-size:11px;color:var(--dim);margin:14px auto 6px;letter-spacing:.3px;max-width:720px}
  #histAside .m{max-width:none;margin:0 0 10px}
  #histAside .doc{margin-bottom:6px}
  /* 备忘录（对话右侧，随手划——2026-09-21 设计稿 D 条 4）：
     收起只占一行、点开是全列；0 条时整块不显示（见 renderMemoPanel）。
     常驻右列（#histAside）内部顶部；窄屏没有右列，随它一起不可见。 */
  #memoSec{border:1px solid var(--line);border-radius:10px;background:var(--bg);
    margin:0 0 12px;overflow:hidden}
  #memoSec .mh{display:flex;justify-content:space-between;align-items:center;
    padding:7px 11px;cursor:pointer;font-size:12px;color:var(--dim)}
  #memoSec .mh .chev{transition:transform .15s;font-size:10px}
  #memoSec.open .mh .chev{transform:rotate(180deg)}
  #memoSec .mb{display:none;border-top:1px solid var(--line);padding:4px 11px 8px}
  #memoSec.open .mb{display:block}
  #memoSec .mi{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;
    padding:6px 0;border-bottom:1px dashed var(--line);line-height:1.5}
  #memoSec .mi:last-child{border-bottom:0}
  #memoSec .mi .mx{flex:1;min-width:0;word-break:break-word}
  #memoSec .mi .mid{font-family:var(--mono);font-size:11px;color:var(--dim);margin-right:5px}
  #memoSec .mi .due{color:var(--acc)}
  #memoSec .mi button{flex:0 0 auto;font-size:11px;padding:1px 8px;margin-top:1px}
  /* 组头与步骤缩进（2026-09-22）：一件事的多步聚在一个组名下（见 memoGroups） */
  #memoSec .mg{font-size:11.5px;color:var(--dim);margin:8px 0 0;letter-spacing:.3px}
  #memoSec .mi.sub{padding-left:12px}

  /* ---- 对话：居中一列，两侧留白 ---- */
  #msgs{overflow-y:auto;padding:24px 4vw 8px}
  /* 底距从 18 收到 12：下面多了操作条那条占位（约一行高），
     两个加起来才是"两条消息之间"的实际留白——不然会松一整行。 */
  .m{margin:0 auto 12px;max-width:720px}
  .m .who{font-size:11px;color:var(--dim);margin-bottom:4px;font-family:var(--mono);letter-spacing:.3px}
  .m .bubble{white-space:pre-wrap;word-break:break-word}
  /* 用户的话像「引用块」，air 的话是正文——参照对话该有的样子：
     air 说的多、你说的少，不该用同样的分量去压。
     **用户的话靠右**（参照 DeepSeek Harness 的对话样式）：不读内容也分得清谁在说。
     气泡上限跟着那边的比例走——它的上限是内容列宽的 0.702，这里的内容列 720px，
     于是 505px；再留一道 82% 兜住窄窗口。 */
  .m.user{display:flex;flex-direction:column;align-items:flex-end}
  .m.user .bubble{background:#e8e0cf;border:1px solid #dbd1bc;border-radius:14px;
                  padding:10px 14px;max-width:min(505px,82%)}
  .m.air .bubble{padding:2px 2px;font-size:14.5px;line-height:1.75}
  /* **粗体** 与 `代码` 的落样式（正文格式化见 md()）——粗体给 600 不用 700：
     老纸色主题下 700 太重，扫行时抢戏。 */
  .m .bubble b{font-weight:600}
  .m .bubble code{font-family:var(--mono);font-size:.92em;background:var(--panel2);
                  border:1px solid var(--line);border-radius:5px;padding:0 4px}

  /* ---- 消息下方的操作条（复制 / 编辑）----
     悬停或键盘聚焦才显（**最后一条用户消息常显**——不然你不知道有这两个按钮，
     无 hover 能力的设备也一律常显）。用 opacity 不用 display：显隐不改布局，
     鼠标扫过去不会跳。 */
  .acts{display:flex;align-items:center;gap:2px;margin-top:2px;min-height:24px}
  .m.user .acts{justify-content:flex-end}
  .acts button{
    display:inline-flex;align-items:center;justify-content:center;
    width:24px;height:24px;padding:5px;border:0;border-radius:24px;
    background:transparent;color:var(--dim);cursor:pointer;
  }
  .acts button:hover{background:var(--panel2);color:var(--fg)}
  .acts button svg{width:15px;height:15px;display:block}
  .acts button.ok{color:var(--ok)}
  .acts button.on{color:var(--acc)}
  /* 「已停止」（2026-10-07）：她说到一半被叫停——**只标记，不改正文**。
     有这个标记，"说完了"与"被打断"在记录里分得清（正文一个字都不动）。 */
  .stopmark{margin-left:6px;font-size:11.5px;color:var(--dim);font-weight:400}
  @media (hover:hover){
    .m .acts{opacity:0;transition:opacity 80ms ease}
    .m:hover .acts,.m:focus-within .acts{opacity:1}
    /* **最后一轮常显**（2026-10-07）：铅笔与弯箭头藏进悬停里，没人知道有这两个口 */
    .m.is-last .acts{opacity:1}
    /* 「后面还有用户消息」的那些用户消息：平时藏，鼠标/键盘落到它上面才显。
       ⚠️ 这两条必须带上同样的 `:has` 前缀——`:has()` 的特异性算它参数那一段，
       不重复写就压不过上面那条隐藏规则（Harness 的 CSS 也是这么绕的）。 */
    .m.user:has(~ .m.user) .acts{opacity:0}
    .m.user:has(~ .m.user):hover .acts,
    .m.user:has(~ .m.user):focus-within .acts{opacity:1}
  }

  /* ---- 编辑一句（只对还没进长期库的那些开放）----
     改的是**底部输入框**里那份文本（抄 ai-chatbot）：所以这里只把原消息压暗
     ——它还站在原地、还能对着看，编辑框不另起一个（谁在改哪句由 `#editBar` 说）。 */
  .m.user.editing .bubble{opacity:.45}
  .m.user.editing .acts{display:none}
  .m.sys .bubble{font-size:12.5px;color:var(--dim);border-left:2px solid var(--line);padding:2px 0 2px 10px}
  /* **动作回执**：air 动过什么必须看得见——不然 air 说"我记下了"，
     你得去翻记忆才知道到底做没做（可观测是工具箱的兜底） */
  .m.act .who{color:var(--acc)}
  .m.act .bubble{font-size:12.5px;border-left:2px solid var(--acc);padding:2px 0 2px 10px;opacity:.9}
  /* **长回执默认折起来**（2026-09-18）：web_fetch 抓回的正文几千字——整段
     铺开会把对话淹掉（截图实证）。可观测性不让步：内容一个字没删，只是先
     收起，点开看全文（带滚动）。折叠方式沿用 `.doc` / `.think` 的既有规矩。 */
  .fold{max-height:132px;overflow:hidden;cursor:pointer;
        -webkit-mask-image:linear-gradient(#000 72%,transparent);
        mask-image:linear-gradient(#000 72%,transparent)}
  .fold.open{max-height:320px;overflow:auto;cursor:zoom-out;
             -webkit-mask-image:none;mask-image:none}
  #wakeWrap.acted #wakeBar{color:var(--acc)}

  /* ---- 「这一轮想起了什么」：折叠条 + 展开详情 ---- */
  #wakeWrap{border-top:1px solid var(--line);background:var(--panel)}
  #wakeBar{max-width:720px;margin:0 auto;padding:8px 4vw;display:flex;align-items:center;
           gap:8px;cursor:pointer;font-size:12.5px;color:var(--dim);user-select:none}
  #wakeBar:hover{color:var(--fg)}
  #wakeBar .chev{margin-left:auto;transition:transform .15s;font-size:11px}
  #wakeWrap.open #wakeBar .chev{transform:rotate(180deg)}
  #wakeBody{display:none;max-height:40vh;overflow-y:auto;border-top:1px solid var(--line);padding:12px 4vw 16px}
  #wakeWrap.open #wakeBody{display:block}
  #wakeBody .box{max-width:720px;margin:0 auto 10px}

  /* 输入区和对话区**用同一套居中线**：外层同样的 4vw 内边距，
     内层同样的 720px 限宽——两边各限各的，必然对不齐（踩过一次）。 */
  #composerWrap{padding:12px 4vw 18px;background:transparent}
  /* 按钮**底部对齐、各自自然高度**：输入框会随内容长高（见 #input），
     默认的 stretch 会把三个按钮一起拉成柱子。 */
  #composer{display:flex;align-items:flex-end;gap:8px;max-width:720px;margin:0 auto}
  /* 输入框**随内容自动长高**，14 行封顶（参考 harness：
     它的 `--dsh-composer-text-max-height:336px` 就是 14 行；
     按这里的行高 24px 换算 = 336 + 22 padding + 2 border = 360），
     到顶后内部滚动。改之前是一条固定 46px 的缝——写长一点就看不见
     自己写了什么，发出去才发现（2026-09-18 修）。 */
  #input{
    flex:1;background:var(--panel);border:1px solid var(--line);color:var(--fg);
    border-radius:12px;padding:11px 14px;font:inherit;resize:none;box-sizing:border-box;
    min-height:46px;max-height:360px;overflow-y:auto;
  }
  #input:focus{outline:none;border-color:#c9b893;box-shadow:0 0 0 3px rgba(138,106,60,.08)}
  /* 拖文件过来时给一个落点。**只是放进输入框**，不自动发送——发不发由他定 */
  #input.dropping{border-style:dashed;border-color:#c9b893;background:var(--panel2)}
  /* 拖进来的文件**先是一个附件**，不是一坨文字：它保持"文件的样子"，
     想看想改再展开（展开之后就只是输入框里的文字了） */
  #attachBar{max-width:720px;margin:0 auto 8px;display:none}
  #attachBar .att{
    display:flex;align-items:center;gap:10px;background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;padding:7px 8px 7px 11px;font-size:13px;
  }
  #attachBar .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #attachBar .warn{color:#c98b6b}
  #attachBar button{padding:4px 10px;font-size:12.5px}
  /* air 要改/删时的确认条：**点一下就算数**，不用去猜他一句话是什么意思 */
  #confirmBar{max-width:720px;margin:0 auto 8px;display:none}
  #confirmBar .cf{
    display:flex;align-items:center;gap:10px;background:var(--panel2);
    border:1px solid #c9b893;border-radius:10px;padding:8px 8px 8px 12px;font-size:13px;
  }
  #confirmBar .cfw{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #confirmBar button{padding:5px 12px;font-size:12.5px}
  /* 编辑态（2026-10-07）：文本灌回**底部输入框**改，这条只说"在编辑哪一句"。
     同 confirmBar 一路——它也是"他做了一个动作"的提示条。 */
  #editBar{max-width:720px;margin:0 auto 8px;display:none}
  #editBar .ef{
    display:flex;align-items:center;gap:10px;background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;padding:7px 8px 7px 12px;font-size:13px;
  }
  #editBar .efw{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
  #editBar button{padding:4px 10px;font-size:12.5px}
  /* 思维链：**默认收起**——air 在想的时候不该刷屏，
     但想知道 air 在想什么的时候能点开（这才是"不用干等"的正解，比超时掐断好） */
  .m.think .who{cursor:pointer;opacity:.7}
  /* 发出的文档在对话里**还是一份文档**（文件卡片 + 点开看全文），
     不是一坨字——参考各家聊天界面处理附件的通行做法 */
  .doc{border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer}
  .docbar{padding:6px 10px;font-size:12.5px;opacity:.8;display:block}
  .doctext{
    display:none;white-space:pre-wrap;font-size:12.5px;opacity:.75;
    max-height:300px;overflow:auto;border-top:1px solid var(--line);padding:8px 10px;
  }
  .doc.open .doctext{display:block}
  .thinkbody{
    display:none;white-space:pre-wrap;font-size:12.5px;opacity:.75;
    border-left:2px solid var(--line);padding-left:10px;margin-top:6px;
    max-height:280px;overflow:auto;
  }
  .m.think.open .thinkbody{display:block}

  button{
    background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:10px;padding:8px 15px;cursor:pointer;font:inherit;font-size:13.5px;
  }
  button:hover{background:#e0d7c2}
  button.primary{background:#8a6a3c;color:#fdfaf3;border-color:#7a5c33}
  button.primary:hover{background:#7a5c33}

  #speakToggle svg{width:16px;height:16px;display:block}

  .why{color:var(--dim);font-size:11.5px;margin-top:3px}
  .empty{color:var(--dim);font-size:12px;padding:4px 0}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--dim);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);
     position:sticky;top:0;background:var(--bg)}
  td{padding:6px 8px;border-bottom:1px solid #e8e0cf;vertical-align:top}
  tr:hover td{background:#f7f2e6}

  /* ---- 设置页「人格」块（2026-10-05）----

     不做分节表单：人格是"写给模型看的一段话"，切成几格输入框等于替他把结构定死

         font-size:12px;line-height:1.55;resize:vertical;box-sizing:border-box}

<body>

<header>
  <button class="icon" onclick="toggleNav()" data-tt="收起 / 展开侧栏">☰</button>
  <h1>air-link-01</h1>
  <span class="stat" id="hCounts"></span>
  <span class="spacer"></span>
  <!-- 和谁聊：切换后她说下一句就换人（选项从 self/personas/ 扫出来） -->
  <select id="personaSel" data-tt="和谁聊（切换后她说下一句就用新人格）"></select>
  <span class="pill" id="hVec">语义</span>
  <span class="pill" id="hLLM">模型</span>
  <span class="pill" id="hDistill" style="display:none"></span>
  <!-- 语音服务开关（起 = 几秒；关 = 放显存）。**顶部快捷**，详细设置在「语音」页 -->
  <button class="ghost" id="voicePower" onclick="toggleVoicePower()">语音：…</button>
  <!-- 自动朗读：**air 的新回复整轮说完才念**（见 autoSpeak）。
       状态存 localStorage——它不进提示词、不影响 air 的行为，是"这台浏览器怎么念" -->
  <button class="icon" id="speakToggle" onclick="toggleSpeakAuto()"></button>
  <button class="ghost" onclick="refreshAll()" data-t="刷新">刷新</button>
  <!-- 右列开关（宽屏）：收起 = 唤醒与「更早的对话」整个让位。初始文字由
       renderAsideBtn() 按语言定（状态在 body.aside-hidden 上，刷新恢复展开） -->
  <button class="ghost" id="asideBtn" onclick="toggleAside()"
    data-tt="收起 / 展开右栏（唤醒 · 更早的对话）">收起</button>
</header>

<main id="main">
  <nav id="side"></nav>
  <div id="stage">
    <!-- 对话：常驻中间 -->
    <section id="chatView">
      <div id="msgs"></div>
      <!-- 右侧栏：宽屏（body.wide）时唤醒条与「更早的对话」都挪到对话右侧
           （网格定位见 CSS；历史回填在 loadHistory 里两条路）。
           窄屏不显示——唤醒条与历史回填全部照旧。 -->
      <aside id="histAside"></aside>
      <!-- 折叠条：平时只占一行，想知道"为什么想起这些"再点开 -->
      <div id="wakeWrap">
        <div id="wakeBar" onclick="toggleWake()">
          <span id="wakeSummary" data-t="还没说话">还没说话</span>
          <span class="chev">▼</span>
        </div>
        <div id="wakeBody">
          <div class="box" id="wakeCues"><div class="empty" data-t="还没说话">还没说话</div></div>
          <div class="box" id="wakeMem"><div class="empty">—</div></div>
          <!-- 「air 这轮看到的短期窗口」：填充在 refreshHeader（数据来自 /api/state） -->
          <div class="box" id="wakeWindow" style="display:none"></div>
        </div>
      </div>
      <div id="composerWrap">
        <div id="attachBar"></div>
        <div id="confirmBar"></div>
        <!-- 编辑这一句（2026-10-07 抄 ai-chatbot）：**文本回到底部输入框**，
             这里只放"正在编辑 + 取消"一条——不自造第二个编辑框
             （旧那套内联 textarea 是自造的，键位还和输入框反着）。 -->
        <div id="editBar"></div>
        <div id="composer">
          <textarea id="input" data-tp="说点什么…（Enter 发送，Shift+Enter 换行）"
            data-tt="把文本文件拖到这里：先当附件收着（不占输入框），发送时跟这条一起发过去；想先看想改，点附件上的「展开改写」"></textarea>
          <button class="primary" id="sendBtn" onclick="send()" data-t="发送">发送</button>
          <!-- 停止：只在生成中现（**生成中才挡得住**——见 busy）。
               点了就断流：她已经说出口的那半句**留在这一段对话里**（后端
               `chat._commit_partial_turn` 落窗口、标 `interrupted`），但它
               **不进长期记忆**（提取时滤掉）——所以这是"说到一半"，不是"这一轮作废"。 -->
          <button class="ghost" id="stopBtn" onclick="stopTurn()" style="display:none"
            data-tt="中断这一轮：她说到一半的那半句留在这段对话里（**不进长期记忆**——以后她不会记得自己说过这句）。想接着听，用「重新生成」——那是把这一轮原样重说一遍，不是从那半句续写" data-t="停止">停止</button>
          <button class="ghost" id="newBtn" onclick="newSession()" data-tt="把这一段收进记忆（提取成场景卡），清掉对话上下文，重新开一段；整理在后台跑（画像在「画像」页看）" data-t="新对话">新对话</button>
        </div>
      </div>
    </section>
    <!-- 其它视图：从左侧点进来，盖住对话 -->
    <section id="panelView" style="display:none"><div id="panel"></div></section>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => (s ?? "").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* 消息正文的轻量格式化：**粗体** 与 `代码`——先 esc 再上标签，注入不进内容。
   叫 md 不叫 fmt：`fmt` 已被下面面板的数字格式化（toFixed）占用——同名 `const`
   在同一个 <script> 里是**语法错误、整页脚本全挂**，撞过一次（2026-09-19）。
   记号必须**紧贴内容**（`**` 后紧跟非空白）：「a ** b ** c」这类数学式、

   white-space:pre-wrap 已经在管。 */
const md = (s) => esc(s)
  .replace(/\*\*(\S(?:[^*\n]*\S)?)\*\*/g, "<b>$1</b>")
  .replace(/`([^`\n]+)`/g, "<code>$1</code>");

/* 当前人格名——文案里的 {p} 从这里取（思考条 / 动作回执 / 面板说明……）。

   `loadPersona`（启动）与下拉 change（切换）两处更新。 */
let CUR_PERSONA = "air";
function curName(){ return PERSONA_LABEL[CUR_PERSONA] || CUR_PERSONA || "air"; }
function t(k, a){
  let s = (I18N[LANG] && I18N[LANG][k]) || k;
  // {p}（人格名）默认注入，不用每个调用点传；其余占位符沿用旧规矩：没传 a 就原样
  if(!a && s.indexOf("{p}") < 0) return s;
  s = s.replace(/\{(\w+)\}/g, (_, name) => {
    if(a && a[name] != null) return a[name];
    if(name === "p") return curName();
    return a ? "" : `{${name}}`;   // 没传参数：未知占位符保持原样（与旧行为一致）
  });
  return s;
}
/* 静态元素的文案：带 `data-t`（正文）/ `data-tt`（title）/ `data-tp`（placeholder）
   的，启动时按当前语言刷一遍；动态渲染的文案在各自的渲染函数里 t()。 */
function paintStatic(){
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-tt]").forEach(el => { el.title = t(el.dataset.tt); });
  document.querySelectorAll("[data-tp]").forEach(el => {
    // 编辑态下输入框的提示是另一句（"改这句…"）——切语言不该把它刷回发送提示
    if(el === $("input") && editingTurn) return;
    el.placeholder = t(el.dataset.tp);
  });
}

function pageHead(tab){

                + `<div class="why" style="margin-bottom:14px">${t(note)}</div>` : "";

async function api(path, opts){
  const r = await fetch(path, opts);
  const d = await r.json().catch(() => ({error:"bad json"}));
  if(!r.ok || d.error) throw new Error(d.error || r.status);
  return d;
}

   编辑**只对窗口里的用户消息开放**——那一段还没进长期库，改它等于改 air 将来会记住什么；
   已进库的那部分是原文，只读（要改理解去「场景」页改摘要，那是另一条链）。
   它那边把「编辑已发消息」删掉了（没后端支撑），我们这边补上了后端，所以按钮才立得住。 */
const ICO = {

  regen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>'

/* 一条消息的「文本」以哪个为准：用户那条以 `_text` 为准（附件并进去之后
   屏幕上的卡片只是它的一部分）；air 那条直接读 DOM——air 在流式里一直变。 */
const bubbleText = (el) => (el._text != null ? el._text
                            : ((el.querySelector(".bubble") || {}).textContent || ""));

/* 复制：优先异步剪贴板，不成退回 execCommand（同 Harness 的 `writeClipboard`——
   本地 `http://` 下 `navigator.clipboard` 可能不可用，那条回退不是摆设）。 */
async function writeClipboard(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){ /* 落到回退那条路 */ }
  try{
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.top = "-1000px"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  }catch(e){ return false; }
}

/* 挂一条操作条（先只有复制）。`text` 用回调传——文本会被就地改，别把旧值闭进去。 */
function msgActions(host, text){
  const row = document.createElement("div");
  row.className = "acts";
  const b = document.createElement("button");
  b.type = "button"; b.title = t("复制"); b.setAttribute("aria-label", t("复制"));
  b.innerHTML = ICO.copy;
  b.onclick = async () => {
    if(b.dataset.busy) return;                 // 连点不重复写
    b.dataset.busy = "1";
    const ok = await writeClipboard(text());
    delete b.dataset.busy;
    if(!ok) return;
    b.innerHTML = ICO.check; b.classList.add("ok"); b.title = t("已复制");
    setTimeout(() => {                         // 一秒收起：它是回执，不是状态
      b.innerHTML = ICO.copy; b.classList.remove("ok"); b.title = t("复制");
    }, 1000);
  };
  row.appendChild(b);
  host.appendChild(row);
  return row;
}

/* 改一句 / 重新生成：**回退重发**——撤掉这一轮（他这句 + 到下一句之前她说的），
   重新走一遍。语义是**回到那一句的地方重说一句**，不是「改一条记录」：
   被撤掉的两条从没进过长期库，撤掉就等于没说过——**所以不留痕**
   （没有记忆被改动，就没有"谁改了什么"要回答；旧那套「改一条消息」动的是记录，才需要）。

   两个入口**分开摆**（2026-10-07 改）：铅笔 = 改这句重发；弯箭头 = 原样再来一遍。
   以前一个按钮兼两义，提示语只能写得又长又绕，而"不改就重发"看着像什么都没发生。

   **窗口里的每一轮都能动**（2026-10-07 放宽，原来只有末尾那一轮）：改第 2 轮，
   就等于把第 2 轮**和它后面那些**一起撤掉重说——撤得掉的边界是**窗口**：
   更早的（已经进了长期库的）撤不了，那不是改错字、是改历史，界面上也不给按钮。
   所以这里维护一个**轮次栈**：窗口里还站着的那些轮次，从头到尾；
   重发 / 重新生成时从目标那一轮截断（`resendTurn` 里的 `splice`），
   **停止不改它**——半句也是这一轮的产物，照常入栈（见 `pushTurn`）。 */
let turnStack = [];             // [{userEl, airEl}]：窗口里还站着的那些轮次（按先后）
// 「有活在飞」的计数 + 在飞的那几条流（FIFO）。为什么是计数不是布尔：她还在答的
// 时候他又发了下一句，**在飞的不止一条**（服务端按锁排队，见 `dashboard.chat_stream`）
// ——布尔会被先收工的那条解除，另一条就成了"按钮不见了、也没人停得掉"。
// 忙碌态因此**推出来**（`busy()`），不各自记一份。
// 「重发 / 重新生成」挡在门外：air 这一轮的回复要**生成完才写进窗口**，
// 边生成边撤会撤到更早那一轮上去，两个流也会撞在一起。
let busyN = 0;
let turnBusy = false;
let turnCtrls = [];   // 在飞的那些流（**FIFO**：第 0 条 = 正在生成的那条，见 `stopTurn`）

/* 给**栈里的每一轮**挂按钮。每次都**先全清再重挂**：重发后气泡是新元素，
   而按钮的 onclick 绑一次就定了——闭进旧元素的话，第二次点会动一个不在页面上的节点。
   操作条的显隐交给 CSS：最后一轮常显，更早的悬停才现（`.m.user:has(~ .m.user)` 那条）。 */
function bindLastTurn(){
  document.querySelectorAll(".acts button[data-edit],.acts button[data-regen]")
          .forEach(b => b.remove());
  document.querySelectorAll("#msgs .m.is-last").forEach(el => el.classList.remove("is-last"));
  turnStack.forEach(turn => {
    addTurnBtn(turn.userEl, "edit", ICO.edit,
               t("编辑这句（改完从这里重发；它后面那些会一起撤掉）"), () => {
      if(turnBusy){ bubble("sys", "系统", t("等这一轮说完再动它。")); return; }
      beginEdit(turn.userEl);
    });
    if(turn.airEl) addTurnBtn(turn.airEl, "regen", ICO.regen,
                              t("重新生成（从这一轮原样重来；它后面那些会一起撤掉）"), () => {
      if(turnBusy){ bubble("sys", "系统", t("等这一轮说完再动它。")); return; }
      regenerate(turn.userEl);
    });
  });
  // 「最后一轮」打标：它的操作条**常显**（其余悬停才现）——藏起来就没人知道
  // 有「编辑 / 重新生成」这两个口（CSS 见 `.m.is-last .acts`）。
  const top = turnStack[turnStack.length - 1];
  if(!top) return;
  top.userEl.classList.add("is-last");
  if(top.airEl) top.airEl.classList.add("is-last");
}

function addTurnBtn(host, key, icon, title, fn){
  const row = host.querySelector(".acts") || msgActions(host, () => bubbleText(host));
  const b = document.createElement("button");
  b.type = "button"; b.dataset[key] = "1";
  b.title = title; b.setAttribute("aria-label", title);
  b.innerHTML = icon;
  b.onclick = fn;
  row.appendChild(b);
  return b;
}

/* 入栈——**三条路都往这儿走**：收到 `end`（说完了）、按了停止（半句也是这一轮的
   产物）、刷新回填（窗口里还站着那几轮）。`airEl` 给 `null` = 这一轮没有可指向的
   气泡（她一个字没说，或那个空壳已经撤了）。
   出栈：重发 / 重新生成时从目标那一轮截断（`resendTurn` 里的 `splice`）。 */
function pushTurn(userEl, airEl){ turnStack.push({userEl, airEl}); bindLastTurn(); }

/* 「有活在飞」进一格 / 出一格：撤销请求占一格，每条在飞的流也占一格——忙碌态
   由计数推出来，**不各自记一份**（两份就会漂：先收工的那条把忙碌解了，另一条
   还在生成，停止键却不见了）。按钮的显隐跟着它走：生成中发送键让位给停止键
   （**换位，不是加一个**：两个都能点的时候，点错一次就是两条流撞在一起）。 */
function busy(on){
  busyN = Math.max(0, busyN + (on ? 1 : -1));
  turnBusy = busyN > 0;
  $("sendBtn").disabled = turnBusy;
  $("stopBtn").style.display = turnBusy ? "" : "none";
}

/* 「停止」：断流。后端收到断开（`GeneratorExit`）会把**她已经说出口的那半句**
   落进窗口（`chat._commit_partial_turn`）——所以这一轮不是作废，是"说到一半"。
   ⚠️ 它只活在窗口里：提取那一步会把它滤掉，长期库（原文 / 场景卡）不留
   （`shortterm.compress_and_extract`）。
   界面这一侧只加标记、不动正文，收尾在 `streamTurn` 的 AbortError 分支里。 */
function stopTurn(){
  // 停的是**正在生成的那条**：FIFO 第 0 条（服务端按锁排队，最先发出去的那条才
  // 是正在答的那条）。**不挑"最新那条"**——那几条还没轮到，断它等于替下一句提前
  // 按了停止，而用户要停的是眼前这条。
  // ⚠️ 别连点：第 0 条断掉、它的请求一收工，下一条就顶上第 0 条；那时若服务端还
  // 没轮到它（还在等锁），撤掉请求**拦不住**她替它写下去（可能落半句进窗口），
  // 界面上却已经是「已停止」的样子。真想清掉它，等它开始答了再按。
  const c = turnCtrls[0];
  if(c) c.abort();
}

/* 把一条用户消息的正文换成新文本。**整块重画**：附件卡片（如果有）不再有意义——
   air 将来记住的就是这段纯文本。 */
function renderUserText(userEl, text){
  userEl._text = text;
  const b = userEl.querySelector(".bubble");
  if(b) b.innerHTML = `<div class="txt">${md(text)}</div>`;
}

/* 重发（**改词重发与重新生成共用这一份**——两套的话迟早长得不一样）：
   ① `/api/turn-undo` 撤掉**这一轮和它后面那些**（窗口里的）→ ② 界面上从这一轮
   往后整片收掉（动作回执留着）→ ③ 走正常那一轮（流式）重新生成。
   撤不掉（已经进长期库了）就如实说：那时候能改的只有「场景」页里的理解。

   失败分两种，收口也不一样（别混成一句"没成"）：
     · **后端明说撤不了**（`d.ok` 假）——状态是清楚的（照后端说的，那一轮不在
       窗口里），如实报一句，屏幕一个字不动；
     · **分不清**（撤销请求没走通 / 流断在半路）——**不猜**，交给 `resyncChat`
       去问服务端要现状，把屏幕重新对上。 */
async function resendTurn(userEl, text){
  const idx = turnStack.findIndex(x => x.userEl === userEl);
  // 不在栈里 = 它已经不在窗口里了（被撤掉、或被提取走了）：撤不了，也没法就地改。
  // 界面上走不到这儿（铅笔只挂在栈里那些轮次上）——真到了就按"分不清"收：
  // 去问服务端，把话退回输入框，而不是摆一个撤不动的编辑态。
  if(idx < 0){ await resyncChat(text, t("这一轮已经不在窗口里了")); return false; }
  const turns = turnStack.length - idx;         // 这一轮 + 它后面的一起撤
  const expect = bubbleText(userEl);            // 窗口里现在存着的那句，交给后端核对
  // ⚠️ **进函数就上锁**，不能等撤销回来再上：`/api/turn-undo` 在飞的那几十毫秒里
  // `turnBusy` 还是 false，连点两下会连撤两轮（第二下撤的是更早那一轮，
  // 而那一轮本来不该动——末尾随第一下变了）。
  busy(true);
  let done;
  try{
    const d = await api("/api/turn-undo", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({turns, expect})});
    if(!d.ok){                                  // 撤不了 / 窗口变了（后端一个字都没撤）
      bubble("sys", "系统", d.detail || t("撤不了这一轮"));
      return false;
    }
    // 窗口里已经没了 → 界面上也收掉：**这一轮（到下一轮开始为止）**整片收，
    // 只留它自己的动作回执（`.act`）——那些动作真发生了，撤的是对话、不是事实。
    // ⚠️ 判据不能写成"紧挨着他的话那几条"：回执是插在**思维链之后、正文之前**的
    // （`bubbleAct` 的 `before`），照"从头一路删"写会把它们一起删掉（和注释说的
    // 就相反了）。所以先划出这一段的边界，段内留 `.act`，**段外整片收**——
    // 后面几轮的一切（连它们的回执）都不留，否则页面上会剩一堆没有对话可依的回执。
    turnStack.splice(idx);
    let stop = userEl.nextElementSibling;          // 这一轮到哪儿为止：下一条他说的
    while(stop && !stop.classList.contains("user")) stop = stop.nextElementSibling;
    let el = userEl.nextElementSibling;
    while(el && el !== stop){                      // 段内：回执留着，其余收掉
      const next = el.nextElementSibling;
      if(!el.classList.contains("act")) el.remove();
      el = next;
    }
    while(stop){                                   // 段外：整片收
      const next = stop.nextElementSibling;
      stop.remove();
      stop = next;
    }
    bindLastTurn();
    const think = thinkBox();
    const air = bubble("air", curName(), "");
    done = await streamTurn(text, air, think, userEl);
    // 停止由 `streamTurn` 自己收尾（半截留着、标「已停止」、入栈），这里不用管；
    // **出错 / 流断在半路**那条它管不了：这一轮在窗口里长什么样分不清——去问服务端。
    // **留在忙里**（同 `send`）：对齐要重画整段，这期间放进来的新消息会被冲掉。
    if(done === "error") await resyncChat(text, t("这一轮断在半路"));
  }catch(e){
    // 撤销那一步就没走通（多半是网络）：**它到底撤没撤，这一侧不知道**——
    // 按"分不清"收（见函数头那段）：去问服务端，话会被退回输入框。
    bubble("sys", "系统", t("没重说成：") + e.message);
    await resyncChat(text, t("重发没走完"));
    return "error";
  }finally{
    busy(false);
  }
  return done;
}

/* 编辑与重新生成**不能同时开着**：撤销会把那一轮整个重跑，而编辑态还指着
   原那一轮——之后按发送会去撤一个已经重跑过的轮次（撤错一轮）。
   所以重新生成前一律**整块退出编辑态**（连输入框一起清），不是只摘个样式。 */
function cancelEditForRegen(){
  if(editingTurn) endEdit(true);
}

/* 重新生成（弯箭头）：**不改文本**，撤掉这一轮（和它后面那些）原样再来一遍。
   弯箭头挂在哪一轮的气泡上，重做的就是哪一轮——不只最后一条。 */
async function regenerate(userEl){
  if(!turnStack.some(x => x.userEl === userEl)) return;
  const before = bubbleText(userEl);
  if(!before.trim()) return;
  cancelEditForRegen();
  try{
    await resendTurn(userEl, before);
  }catch(e){
    bubble("sys", "系统", t("没重说成：") + e.message);
  }
}

/* 编辑：**文本回到底部输入框**改，改完按发送键重发（2026-10-07 抄 ai-chatbot 的
   `message-editor` + `multimodal-input` 那一路）。

   为什么改成这样：原来自己造了一个**内联编辑框**，于是页面里有两套文本输入，
   键位还反着（编辑框 Enter 换行、主输入框 Enter 发送）——两套键位混着用必按错。
   主流做法是**复用同一个输入框**：铅笔 = "把这句话放回输入框"，发送键就是
   "保存并重发"。少一套 UI，键位自然只有一套。

   屏幕上的原消息**留着、只压暗**（不是藏起来）：改的时候还看得见原来那句。 */
let editingTurn = null;         // {userEl, before}：正在改哪一条、它原来是什么

function beginEdit(userEl, text){
  const before = userEl._text != null
    ? userEl._text : ((userEl.querySelector(".bubble") || {}).textContent || "");
  if(!before.trim()) return;
  if(editingTurn) endEdit(false);          // 已经在改另一条：先收掉（只保留一处编辑态）
  editingTurn = {userEl, before};
  userEl.classList.add("editing");
  const box = $("input");
  // `text`：要放回输入框的那份（提交失败时用它把**改好的那句**还回来）；
  // 不给就用原话（点铅笔的正常进来那一路）。
  box.value = text != null ? text : before;
  box.placeholder = t("改这句…（Enter 保存并重发，Esc 取消）");
  fitInput();
  box.focus();
  box.setSelectionRange(box.value.length, box.value.length);
  // 改第 N 轮 = 它后面那些也一起撤掉（2026-10-07 放宽之后才有的事）——
  // **这条得印在脸上**，不能只藏在悬停提示里：他点「保存并重发」时，
  // 后面几轮会当场消失，事先不说清就是坑。
  const idx = turnStack.findIndex(x => x.userEl === userEl);
  const after = idx < 0 ? 0 : turnStack.length - idx - 1;
  $("editBar").style.display = "block";
  $("editBar").innerHTML = `<div class="ef"><span class="efw">`
    + esc(after > 0
        ? t("正在编辑这一句——改完按「发送」重发，它后面那 {n} 轮会一起撤掉", {n: after})
        : t("正在编辑这一句——改完按「发送」重发"))
    + `</span><button type="button" id="editCancel">${t("取消")}</button></div>`;
  $("editCancel").onclick = () => endEdit(true);
}

/* 退出编辑态。`clearBox`：顺手把输入框清空（取消时清，提交时已经先清了）。 */
function endEdit(clearBox){
  const cur = editingTurn;
  editingTurn = null;
  if(cur) cur.userEl.classList.remove("editing");
  $("editBar").style.display = "none";
  $("editBar").innerHTML = "";
  const box = $("input");
  box.placeholder = t("说点什么…（Enter 发送，Shift+Enter 换行）");
  if(clearBox){ box.value = ""; fitInput(); box.focus(); }
}

/* 提交编辑：**撤掉这一轮 + 用改后的文本重发**（发送键与 Enter 都走这里）。 */
async function submitEdit(){
  const cur = editingTurn;
  const next = $("input").value.trim();
  if(!next) return;                       // 空的没什么可说——等同取消（按键什么都不做）
  if(turnBusy){ bubble("sys", "系统", t("等这一轮说完再动它。")); return; }
  endEdit(false);
  $("input").value = ""; fitInput();      // 这句已经交出去了
  let done;
  try{
    done = await resendTurn(cur.userEl, next);
  }catch(e){
    // `resendTurn` 自己兜住了它那几条失败路（撤不成 / 断在半路）——能到这儿的是
    // 意外（代码错），如实报一句，别吞掉。
    bubble("sys", "系统", t("没重说成：") + e.message);
    done = "error";
  }
  if(done === false){
    // **撤销没成**（后端的原话已经报过了）：把改好的话还他。
    // ⚠️ 这一轮还在栈里（改一下还能再试）才摆回编辑态；**不在栈里就不摆**——
    // 那会让下一次发送去撤一个栈里没有的轮次，按下去什么都不发生，看着就是卡住。
    //（"分不清"那两条路（断在半路 / 撤不了）的收口在 `resendTurn` 里，已问过服务端，
    //  话也已经放回输入框；这里只是兜一层，免得任何一条路上把那句弄丢。）
    if(turnStack.some(x => x.userEl === cur.userEl)) beginEdit(cur.userEl, next);
    else { const box = $("input"); box.value = next; fitInput(); box.focus(); }
    return;
  }
  // ⚠️ **撤销没成就不许改写气泡**（上面已经 return 了）：屏幕上的话改了、
  // 记忆里还是原文，是"看着改了、其实没改"那类最难查的错位。
  // 成功与停止都要改：他要的就是改后的那句，服务端落的也是它。
  //（"error" 那条由 `resyncChat` 重画过整段，这里不能再动它。）
  if(done === "ok" || done === "abort"){
    if(next !== cur.before) renderUserText(cur.userEl, next);
  }
}

/* 标一下「这句说到一半」：**只加标记，一个字都不动正文**——那是她的原话。 */
function markStopped(airEl){
  const who = airEl && airEl.querySelector(".who");
  if(!who || who.querySelector(".stopmark")) return;
  const s = document.createElement("span");
  s.className = "stopmark";
  s.textContent = t("（已停止）");
  who.appendChild(s);
}

/* ---------- 语音播报（走本地语音服务，见 tts/）----------
   为什么不用浏览器自带的 `speechSynthesis`：那档是"机器念字"，
   而这里要的是**air 的声音**——固定音色、语气由他调的音色刻度定。
   服务在 `tts/`（独立 venv + 模型，见 tts/README.md）；它没起的时候
   这里只报一句"没接上"，其余功能一点不受影响。

   **念之前先清洗文本**：air 的话里有 markdown 和代码，直接念是灾难
   （代码块会被逐字念出来）。规则见 `speakText()`。

   念的路有两条，**默认走流式**（见 `speakStreaming`）：来一帧 PCM 就排一帧，
   air 开口只等第一帧（约 0.6s），不等整段生成完（约 4.5s）。这条路用不了
   （老服务 / 浏览器不给读流）就退回整段 + `<audio>`——两条路的声音是同一份
   （tts/server.py 里 `to_wav` 和流式共用一个 `pcm16` 转换）。 */
let speakAudio = null;      // 退回"整段"时那个 <audio>
let speakingEl = null;      // 正在念的那条消息（再点一下＝停）
let speakCtx = null;        // 流式播放用的 AudioContext（一个页面一个）
let speakEnd = 0;           // 下一帧该排到哪个时刻（接缝靠它连续，不靠 setTimeout）
let speakCtrl = null;       // 正在读的那条流（停的时候 abort 它）
let speakSrcs = [];         // 已排进队列的音频块（停的时候挨个停）

function speakText(raw){
  // ⚠️ 变量不能叫 `t`——会遮住全局翻译函数（重命名过一次，别改回去）
  let s = (raw || "");
  s = s.replace(/```[\s\S]*?```/g, t("（一段代码）"));   // 代码块不逐字念
  s = s.replace(/`([^`]+)`/g, "$1");                 // 行内代码只念内容
  s = s.replace(/!\[[^\]]*\]\([^)]*\)/g, "");        // 图片没有可念的
  s = s.replace(/\[([^\]]+)\]\([^)]*\)/g, "$1");     // 链接只念文字
  s = s.replace(/\*\*([^*]+)\*\*/g, "$1");           // 粗体
  s = s.replace(/(^|[\s(（])[*_]([^*_\n]+)[*_]/g, "$1$2");   // 斜体
  s = s.replace(/^#{1,6}\s*/gm, "");                 // 标题号
  s = s.replace(/^\s*[-*+]\s+/gm, "");               // 列表符号
  s = s.replace(/^\s*>\s?/gm, "");                   // 引用号
  s = s.replace(/\n{2,}/g, "\n");                    // 空行压掉（不然停顿很长）
  return s.trim();
}

function setSpeaking(el, on, note){
  const b = el && el.querySelector('.acts button[data-speak]');
  if(!b) return;
  b.innerHTML = on ? ICO.stop : ICO.sound;
  b.classList.toggle("on", !!on);
  b.title = on ? (note || t("停止朗读")) : t("朗读");
  b.setAttribute("aria-label", on ? t("停止朗读") : t("朗读"));
}

function stopSpeak(){
  // 两条路都要停干净：流那条要 abort（不然读着的连接一直挂着）+ 把排好的块挨个停
  if(speakCtrl){ try{ speakCtrl.abort(); }catch(e){ /* 已经断了 */ } speakCtrl = null; }
  speakSrcs.forEach(s => { try{ s.stop(); }catch(e){ /* 还没开始或已经结束 */ } });
  speakSrcs = []; speakEnd = 0;
  if(speakAudio){ try{ speakAudio.pause(); }catch(e){ /* 已经停了 */ } speakAudio = null; }
  if(speakingEl) setSpeaking(speakingEl, false);
  speakingEl = null;
}

/* ---- 流式播放：**自己排，不用 <audio>** ----
   `<audio>` 要等整段文件；而 WAV 又喂不进 MediaSource（那个只吃 mp4/webm/mp3）。
   所以这里把 PCM 排进 AudioContext：一帧进来就建一个 AudioBuffer，排在"上一帧
   结束的时刻"（`speakEnd`）上——排的是**时刻**而不是"立刻播"，接缝因此天然连续，
   不是靠 setTimeout 对齐（那个会抖）。 */
function speakCtxGet(){
  if(!speakCtx) speakCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(speakCtx.state === "suspended") speakCtx.resume();   // 自动播放策略：点过页面就允许
  return speakCtx;
}

function speakQueue(pcm, n, sr){
  const ctx = speakCtxGet();
  const dv = new DataView(pcm.buffer, pcm.byteOffset, pcm.byteLength);
  const f32 = new Float32Array(n);                        // Int16 → [-1,1]
  for(let i = 0; i < n; i++) f32[i] = dv.getInt16(i * 2, true) / 32768;
  const buf = ctx.createBuffer(1, n, sr);
  buf.copyToChannel(f32, 0);
  const src = ctx.createBufferSource();
  src.buffer = buf; src.connect(ctx.destination);
  // 起手留 0.15s 余量（第一帧在路上的时间 + 调度抖动）；之后贴着上一帧末尾排
  const at = Math.max(ctx.currentTime + 0.15, speakEnd || 0);
  src.start(at);
  speakEnd = at + n / sr;
  speakSrcs.push(src);
  src.onended = () => {
    speakSrcs = speakSrcs.filter(x => x !== src);
    if(!speakSrcs.length && !speakCtrl) stopSpeak();      // 最后一块也放完了：按钮复原
  };
}

function speakU8cat(a, b){
  const c = new Uint8Array(a.length + b.length);
  c.set(a); c.set(b, a.length);
  return c;
}

/* 流式播报。**第一帧排上就算成了**（所以返回值是"这条路的结论"，不是音频本身）：
     {ok:true}       已经在流着播了
     {fallback:true} 这条路用不了（老服务 / 不是流 / 断网）——调用方退回整段
     {error:"..."}   服务在开始前就报了错——调用方弹出来，别再退 */
async function speakStreaming(el, text, opts){
  const o = opts || {};
  // **只在试听时**才带 speaker / dims / instruct_extra：平时这些字段由后端从
  // `user_prefs` 取（页面不重复管一份设置，两处各存一份必然漂移）。
  const payload = {text, stream: true};
  if(o.speaker !== undefined) payload.speaker = o.speaker;
  if(o.dims !== undefined) payload.dims = o.dims;
  if(o.instruct_extra !== undefined) payload.instruct_extra = o.instruct_extra;
  const ctrl = new AbortController();
  speakCtrl = ctrl;
  let res;
  try{
    res = await fetch("/api/speak", {method:"POST", signal: ctrl.signal,
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(payload)});
  }catch(e){
    if(speakCtrl === ctrl) speakCtrl = null;
    return {fallback:true};
  }
  if(!res.ok || !res.body){
    // 服务在开始前就报错（没接上 / 显存不够）：它仍然是一份 JSON，原样带出去
    let d = null; try{ d = await res.json(); }catch(e){ /* 不是 JSON 就退 */ }
    if(speakCtrl === ctrl) speakCtrl = null;
    return (d && d.detail) ? {error: d.detail} : {fallback:true};
  }
  const reader = res.body.getReader();
  let buf = new Uint8Array(0), sr = 0, head = false, queued = 0;
  while(true){
    let chunk;
    try{ chunk = await reader.read(); }
    catch(e){ break; }                     // abort（他点了停）也走到这
    if(chunk.done) break;
    if(speakingEl !== el) break;           // 念别的去了：这份丢掉
    buf = speakU8cat(buf, chunk.value);
    if(!head){
      if(buf.length < 12) continue;
      if(String.fromCharCode(buf[0], buf[1], buf[2], buf[3]) !== "ARAU"){
        try{ reader.cancel(); }catch(e){ /* 已经断了 */ }
        if(speakCtrl === ctrl) speakCtrl = null;
        return {fallback:true};            // 老版本服务回的是整段 wav
      }
      sr = new DataView(buf.buffer, buf.byteOffset).getUint32(4, true);
      buf = buf.slice(12); head = true;
    }
    while(true){                           // 帧：[样本数 i32][Int16 PCM]
      if(buf.length < 4) break;
      const n = new DataView(buf.buffer, buf.byteOffset).getInt32(0, true);
      if(buf.length < 4 + n * 2) break;    // 半帧：等下一块（网络不按帧切）
      const pcm = buf.slice(4, 4 + n * 2);
      buf = buf.slice(4 + n * 2);
      if(n > 0){
        speakQueue(pcm, n, sr);
        if(++queued === 1) setSpeaking(el, true, t("正在念…（再点一下停）"));
      }
    }
  }
  if(speakCtrl === ctrl) speakCtrl = null;
  return {ok: true};
}

/* 念一条消息。**再点一下 = 停**（同一条的按钮在念的时候就是停止键；
   念别的会自动停掉上一条，不会叠着念）。 */
async function speak(el, raw){
  const text = speakText(raw);
  if(!text) return;
  if(speakingEl === el){ stopSpeak(); return; }
  stopSpeak();
  // 记住"正在念哪条"：**再点一下＝停**、念别的会自动停掉上一条、生成期间换目标要作废，
  // 全靠它——之前少了这一行，628 行那个判断永远不成立（停止键是坏的），
  // 636/654 行那两个守卫又永远成立（退回整段那条路会被静默拦掉、一声不出）。
  speakingEl = el;
  setSpeaking(el, true, t("正在生成语音…（再点一下取消）"));
  const got = await speakStreaming(el, text);
  if(speakingEl !== el) return;          // 生成期间他点了别的：这份音频就不要了
  if(got.error){                         // 服务如实报的错：原样说，别再退
    setSpeaking(el, false);
    bubble("sys", "系统", t("语音没播出来：") + got.error);
    return;
  }
  if(!got.fallback) return;              // 流着播了（第一帧已经排上）
  let d;                                 // 退回整段：老服务 / 浏览器不给读流
  try{
    d = await api("/api/speak", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({text})});
  }catch(e){ d = {ok: false, detail: e.message}; }
  if(!d.ok){
    setSpeaking(el, false);
    bubble("sys", "系统", t("语音没播出来：") + (d.detail || t("没接上语音服务")));
    return;
  }
  if(speakingEl !== el) return;          // 生成期间他点了别的：这份音频就不要了
  try{
    const a = new Audio(d.audio);
    speakAudio = a;
    a.onended = a.onerror = () => { if(speakingEl === el) stopSpeak(); };
    await a.play();
  }catch(e){
    stopSpeak();
    bubble("sys", "系统", t("音频播不了：") + e.message);
  }
}

/* 给一条消息的操作条加「朗读」 */
function addSpeakBtn(row, host){
  const b = document.createElement("button");
  b.type = "button"; b.dataset.speak = "1";
  b.innerHTML = ICO.sound; b.title = t("朗读"); b.setAttribute("aria-label", t("朗读"));
  b.onclick = () => speak(host, bubbleText(host));

}

/* 自动朗读：**整轮说完才念**（流式边出边念会一顿一顿、还会重复同一句）。
   开关存 localStorage：它不进提示词、不影响 air 的行为，是"这台浏览器怎么念"——
   要跨设备再挪进 `user_prefs`（那一步会多一个端点，先不背）。 */
function speakAuto(){
  try{ return localStorage.getItem("speak_auto") === "1"; }catch(e){ return false; }
}
function renderSpeakToggle(){
  const b = $("speakToggle");
  if(!b) return;
  const on = speakAuto();
  b.innerHTML = on ? ICO.sound : ICO.soundOff;
  b.classList.toggle("on", on);
  b.title = on ? t("自动朗读：开（点一下关）") : t("自动朗读：关（点一下开）");
  b.setAttribute("aria-label", on ? t("关闭自动朗读") : t("打开自动朗读"));
}
function toggleSpeakAuto(){
  const on = !speakAuto();
  try{ localStorage.setItem("speak_auto", on ? "1" : "0"); }catch(e){ /* 存不了就只生效这一次 */ }
  if(!on) stopSpeak();
  renderSpeakToggle();
}

/* ---------- 顶栏的语音服务开关（起 / 关）----------
   一个按钮管"服务在不在"：点一下起（几秒）、再点一下关（放显存）。
   跟旁边那个喇叭分工不同——喇叭管"念不念"，这里管"服务开不开"。 */
let voiceUp = null;                    // null = 还没查到（按钮显示"…"）
function renderVoicePower(on){

  if(!b) return;
  voiceUp = !!on;
  b.textContent = on ? t("语音：开") : t("语音：关");
  b.classList.toggle("on", !!on);
  b.title = on ? t("语音服务在跑——点一下 = 关掉（放显存）")
               : t("语音服务没起——点一下 = 起起来（几秒）");
}
async function refreshVoicePower(){
  try{
    const d = await api("/api/voice");
    renderVoicePower(!!(d.status && d.status.ok));
  }catch(e){ renderVoicePower(false); }
}
async function toggleVoicePower(){
  const b = $("voicePower");
  if(!b || b.disabled) return;
  b.disabled = true;
  try{
    if(voiceUp){
      b.textContent = t("语音：关闭中…");
      const d = await api("/api/voice/stop", {method:"POST",
        headers:{"Content-Type":"application/json"}, body:"{}"});

}
function autoSpeak(el, raw){

}

/* ---------- 对话 ---------- */
function bubble(cls, who, text){
  const d = document.createElement("div");
  d.className = "m " + cls;
  // 「系统 / 你」这类署名也过翻译——那是界面自己的话，不是数据
  const name = who === "系统" ? t("系统") : (who === "你" ? t("你") : who);
  d.innerHTML = `<div class="who">${esc(name)}</div><div class="bubble">${md(text)}</div>`;
  $("msgs").appendChild(d);
  $("msgs").scrollTop = $("msgs").scrollHeight;
  // air 的回话可以复制、可以朗读（系统消息不挂：那是告示，不是「说过的话」）
  if(cls === "air") addSpeakBtn(msgActions(d, () => bubbleText(d)), d);
  return d;
}

/* 思维链：**默认收起**——air 在想的时候不该被刷屏，
   但想知道 air 在想什么的时候能点开。
   （这是"不用干等"的正解：超时掐断是把刀架在思考上，这个是把过程给你看。） */
function thinkBox(){
  const d = document.createElement("div");
  d.className = "m air think";
  d.innerHTML = `<div class="who" onclick="this.parentNode.classList.toggle('open')">`
    + `<span class="tbar">${t("{p} 在想…")} <span class="t">0.0s</span></span></div>`
    + `<div class="thinkbody"></div>`;
  $("msgs").appendChild(d);
  const t0 = Date.now();
  const secs = () => ((Date.now() - t0) / 1000).toFixed(1) + "s";
  return {
    add(s){
      d.classList.add("has");        // 有的模型没有思维链，那就只剩计时
      d.querySelector(".thinkbody").textContent += s;
      d.querySelector(".t").textContent = secs();
    },
    finish(){
      d.classList.remove("open");
      const bar = d.querySelector(".tbar");
      if(bar) bar.textContent = d.classList.contains("has")
        ? t("想了 {s}（点开看 {p} 怎么想的）", {s: secs()}) : t("想了 {s}", {s: secs()});
    }
  };
}

/* 他的消息：**有附件就显示成一份文档**（卡片 + 点开看全文）。
   发出去的内容仍然是全文（air 要读到），但**对话里看到的该是文档的样子**——
   发一篇几千字的东西，不该把整屏摊满。 */
function bubbleUser(said, att){
  let inner = "";
  if(att){
    inner += `<div class="doc" onclick="this.classList.toggle('open')">`
      + `<span class="docbar">${t("文档 · {name} · {n} 字（点开看）", {name: esc(att.name), n: att.text.length})}</span>`
      + `<div class="doctext">${esc(att.text)}</div></div>`;
  }
  if(said) inner += `<div class="txt">${md(said)}</div>`;
  const d = document.createElement("div");
  d.className = "m user";
  d.innerHTML = `<div class="who">${t("你")}</div><div class="bubble">${inner}</div>`;
  // 真正发出去的那一份（附件已经并进来了）——复制和编辑都取它，
  // 不取屏幕上那点：屏幕上是一条消息，库里是完整的一段。
  d._text = att ? (said ? said + "\n\n" + att.text : att.text) : said;
  $("msgs").appendChild(d);
  $("msgs").scrollTop = $("msgs").scrollHeight;
  msgActions(d, () => bubbleText(d));
  return d;
}

/* air 要改 / 要删时弹的确认条。**点一下就算数**——
   这比"猜他那句话是不是同意"可靠得多，也不用等下一轮。 */
function showConfirm(c){
  const bar = $("confirmBar");
  if(!c){ bar.style.display = "none"; bar.innerHTML = ""; return; }
  const del = c.tool === "forget_memory";
  const ids = c.scene_ids || (c.scene_id ? [c.scene_id] : []);
  const many = ids.length > 1 ? t("{n} 条（{ids}）", {n: ids.length, ids: ids.join("、")}) : "";
  let what, acts;
  if(del){
    // 三选一（2026-09-23，工具箱稿 §3.4）：她只负责列出来，怎么处置由他点。
    // **危险靠右**——最贵的一档不该在手指最顺的位置。
    what = many ? t("{p} 想把这几条列出来处理：{ids}", {ids: esc(many)})
                : t("{p} 想把 {id}「{title}」列出来处理",
                    {id: esc(c.scene_id), title: esc(c.title)});
    acts = `<button class="ghost" onclick="answerConfirm('keep')">${t("不删除")}</button>`
      + `<button class="ghost" onclick="answerConfirm('archive')">${t("归档冷存")}</button>`
      + `<button class="danger" onclick="answerConfirm('delete')">${t("彻底删除")}</button>`;
  }else{
    // 改哪一栏也要看得见：`field_label` 由后端按层给（`pending_view`，2026-09-24 起
    // 三层都能改标签）——不标的话「改标题 / 改情境」和「改摘要」在这条上长得一模一样。
    what = t("{p} 想把 {id}「{title}」改成「{text}」",
             {id: esc(c.scene_id), title: esc(c.title), text: esc(c.text)})
         + (c.field_label ? t("（改{field}）", {field: esc(c.field_label)}) : "");
    acts = `<button class="primary" onclick="answerConfirm('accept')">${t("执行")}</button>`
      + `<button class="ghost" onclick="answerConfirm('keep')">${t("算了")}</button>`;
  }
  bar.style.display = "block";
  bar.innerHTML = `<div class="cf"><span class="cfw">${what}</span>${acts}</div>`;
}

async function answerConfirm(action){
  showConfirm(null);          // 先收起来：连点两下不该执行两次
  try{
    const d = await api("/api/confirm", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify({action})});
    bubble("sys", "系统", d.detail || t("没动它"));
    refreshHeader(); refreshPanel(); refreshAll();
  }catch(e){ alert(t("没做成：") + e.message); }
}

/* air 动过什么的回执。**说清动作、成没成、结果是什么**——
   不留文本协议（不解析 air 的话来猜），靠这条回执看得见。
   **长回执默认折起来**（web_fetch 抓回的正文有几千字，整段铺开会把对话
   淹掉）：先露开头，点一下看全文（带滚动）——内容没删，只是不占版面。 */
const ACT_FOLD_CHARS = 200;     // 超过这个字数才折（约两三行就不折了）
function bubbleAct(name, detail, ok, before){
  const d = document.createElement("div");
  d.className = "m act";
  const long = (detail || "").length > ACT_FOLD_CHARS;
  d.innerHTML = `<div class="who">${ok ? t("{p} 做了") : t("没做成")}${long ? t(" · 点开看全文") : ""}</div>`
    + `<div class="bubble${long ? " fold" : ""}">${esc(name)}　${esc(detail)}</div>`;
  const b = d.querySelector(".bubble");
  if(long) b.onclick = () => b.classList.toggle("open");
  // `before`（= 这一轮的正文气泡）：回执排到**正文之前**——工具是"边想边做"
  // 的过程，过程在前、结果在后（同 think 条一路）；多个动作按发生顺序
  // 逐一插到正文前，自然保序。不带锚点时照旧追加到末尾。
  if(before) before.before(d);
  else $("msgs").appendChild(d);
  $("msgs").scrollTop = $("msgs").scrollHeight;
  return d;
}

async function send(){
  // 编辑态下，发送键就是「保存并重发」——键盘与按钮走的是同一个入口，
  // 所以两边的语义不可能错开（抄的是 ai-chatbot：编辑态里那个发送键就是提交编辑）。
  if(editingTurn) return submitEdit();
  const box = $("input");
  const said = box.value.trim();
  showConfirm(null);   // 他又开口了：那条确认条作废（他要说的话自己会回答它）
  // 附件在这一刻并进消息——**发出去之后它就是一条普通消息**，没有特例
  let msg = said;
  if(attachment) msg = (said ? said + "\n\n" : "") + attachment.text;
  if(!msg) return;
  if(activeTab !== "对话") switchTab("对话");   // 在别的视图里发消息 → 自动切回对话
  box.value = ""; box.style.height = "";   // 展开改写过时展开过，发完收回
  const userEl = bubbleUser(said, attachment);   // 渲染完再清，不然卡片里没东西
  clearAttachment();                       // 附件跟着这一条一起走了

  const think = thinkBox();                // **先想后说**：思维链在 air 的话上面
  const air = bubble("air", curName(), "");
  busy(true);
  let done;
  try{
    done = await streamTurn(msg, air, think, userEl);   // 停止的收尾在它里面（见 AbortError 分支）
    // 断在半路 / 出错：这一轮到底算不算数，这一侧分不清——去问服务端，把屏幕重新对上。
    // **留在忙里**：对齐时要重画整段，这期间再放进来一句新的，重画会把它连气泡一起冲掉。
    // `said` 是**他打的那份**：附件并进消息那一份不进输入框，这里也一样（空的就不填）。
    if(done === "error") await resyncChat(said, t("这一轮断在半路"));
  }finally{
    busy(false); box.focus();
  }
}

/* 一轮生成 + 渲染——**发消息 / 改词重发 / 重新生成共用这一份**
   （两套的话迟早会长得不一样）。

   返回 `"ok"` / `"abort"` / `"error"`——**三条路的收尾各不相同**：
     `"ok"`    收到 `end`（后端已把这一轮写完进窗口），气泡照常留着；
     `"abort"` 他按了停止：半句留着、标「已停止」，后端也把它落进了窗口
               （`chat._commit_partial_turn`）——这一轮**算数**（能改、能重新生成）；
     `"error"` 出错**或流断在半路**（没等到 `end`）：这一轮在窗口里长什么样，
               这一侧分不清——**不猜**，由调用方去问服务端（`resyncChat`）。 */
async function streamTurn(msg, air, think, userEl){
  const body = air.querySelector(".bubble");
  const scroll = () => { $("msgs").scrollTop = $("msgs").scrollHeight; };
  let text = "";
  let ended = false;                     // 收到 end = 后端已写完窗口，这一轮算数
  const ctrl = new AbortController();
  turnCtrls.push(ctrl);                  // 「停止」断的就是它（FIFO 第 0 条 = 正在生成那条）
  try{
    const res = await fetch("/api/chat/stream", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({msg}), signal: ctrl.signal
    });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const reader = res.body.getReader(), dec = new TextDecoder("utf-8");
    let buf = "";
    for(;;){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      let i;
      while((i = buf.indexOf("\n\n")) >= 0){        // SSE：事件之间空一行
        const block = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
        if(!block.startsWith("data:")) continue;
        let ev; try{ ev = JSON.parse(block.slice(5)); }catch(e){ continue; }
        if(ev.type === "reasoning") think.add(ev.text || "");
        else if(ev.type === "content"){
          // 每帧把**已收全文**重渲染（不是在增量上做替换）：`**` 会横跨两个
          // chunk，半截星号在增量上换不出来（真的坏过：粗体显示成星号）。
          text += ev.text || ""; body.innerHTML = md(text); scroll();
        }else if(ev.type === "tool"){
          // 回执排在**正文之前**（过程在前、结果在后）：气泡是空壳先建的，
          // 不插的话动作会被追到正文底下——读起来像"说完才做"，与事实相反
          bubbleAct(ev.name || "", ev.detail || "", !!ev.ok, air);
        }else if(ev.type === "end"){
          ended = true;
          // air 一个字都没回（失败）→ 撤掉那个空的气泡，提示走**系统消息**：
          // 失败提示不是"air 说过的话"，不该顶在 air 的话的位置上，也不该进记忆
          //（后端也没把它写进窗口——`hint` 和 `reply` 是两条通道）。
          if(!ev.reply){
            air.remove();
            bubble("sys", "系统", ev.hint || t("（这一轮 {p} 没说话。）"));
          }
          renderWake(ev.recall, ev.tools);
          // 这一轮落定 → 入栈（见 `pushTurn`）。⚠️ 她一个字都没说时那个空壳已经撤了，
          // 入栈的 air 头必须给 `null`：把一个**已经从页面上摘掉的节点**塞进栈，
          // `bindLastTurn` 会给它挂按钮、`is-last` 也打在它身上，屏幕上这份反而没有。
          pushTurn(userEl, ev.reply ? air : null);
          // 自动朗读：**整轮说完才念**（流式边出边念会一顿一顿、还会重复）
          if(ev.reply) autoSpeak(air, ev.reply);
          if(ev.confirm) showConfirm(ev.confirm);   // air 在等一句"是/不"
          // 被额度掐断（还有正文）时说一声——不然「说了一半」看起来像正常结束
          if(ev.truncated) bubble("sys", "系统",
            t("（这段被额度截断了——把设置里的 max_tokens 调大，或者把话拆小一点）"));
          // （原来这里发一条「提取回执」（提取了一段对话 → S1-000x…）——
          //   自动提取每次都会冒一条，对天天用的人只是噪声；2026-09-20
          //   按反馈删了。提取照常发生，结果去「场景」页看，那才是它的正主。）
          refreshHeader(); refreshPanel();
        }
      }
    }
  }catch(e){
    // 他按了停止：**气泡留着，一个字段都不改**——她说到一半的那半句是她的原话。
    // 后端那边由 `GeneratorExit` 把它落进窗口（`chat._commit_partial_turn`），
    // 所以这一轮**算数**：能改、能重新生成、这一段的窗口里也还在（栈照常入）。
    // ⚠️ 但它**只在窗口里活着**：提取那一步会把它滤掉（`shortterm.compress_and_extract`）
    // ——长期库（原文 / 场景卡）里不会有；等这一段被提取走，刷新后那半句也就不在了。
    // 屏幕上只加一个「已停止」的标记，让人分得清"说完了"和"被叫停了"。
    // ⚠️ `end` 已经收到过就**不算停**：那一刻后端写的是完整那一轮（入栈也发生过了），
    // 再按停止处理会重复入栈、还给它挂个不该有的标记。
    if(e && e.name === "AbortError"){
      if(ended) return "ok";
      if(text.trim()){ markStopped(air); pushTurn(userEl, air); }
      else { air.remove(); pushTurn(userEl, null); }   // 一个字都没说：不摆一个空气泡
      return "abort";
    }
    body.innerHTML = md(text || (t("这一轮没成：") + e.message));
    return "error";
  }finally{
    turnCtrls = turnCtrls.filter(c => c !== ctrl);   // 收工：从"在飞"里摘掉（忙碌态见 `busy`）
    think.finish();
  }
  // 流读完却**没等到 `end`**：连接是半路断的（服务端炸了、网断了、代理掐了）。
  // 这一轮在窗口里长什么样（她半句落没落）这一侧不知道——**不猜**，按出错那条收，
  // 由调用方去问服务端（`resyncChat`）。正常结束一定有 `end`：后端在它里面写完窗口。
  return ended ? "ok" : "error";
}

/* 「新对话」：把这一段收进记忆，再把对话区清空——真的重新开始。
   后端 `/api/new-session` 和收尾（`/api/end`）是同一个动作（提取 + 后台整理），
   只多一步：**连压缩摘要一起清**，窗口里不留上一段的东西。记录没丢：原文早进长期库，
   「打捞」里能翻、刷新页面也会按 `/api/history` 回填。
   ⚠️ 提取要调一次 LLM（几秒），期间按住按钮，防连点（连点两次会多提取一遍）。 */
async function newSession(){
  const b = $("newBtn");
  if(b && b.disabled) return;
  if(b) b.disabled = true;
  try{
    const d = await api("/api/new-session", {method:"POST",
      headers:{"Content-Type":"application/json"}, body:"{}"});
    clearChat();
    bubble("sys", "系统", (d.written
      ? t("这一段收进记忆了 → {id}「{title}」", {id: d.written.scene_id, title: d.written.title})
      : t("这一段没什么要记的（窗口空）")) + "　·　" + t("新的一段，从这里开始。"));
    refreshAll();
  }catch(e){ bubble("sys","系统",t("新对话失败：")+e.message); }
  finally{ if(b) b.disabled = false; }
}
/* 清空对话区（「新对话」用；`resyncChat` 重画之前也走它）：消息、右列的摘要与
   「更早的对话」都收走。**只清界面**——记忆在后端，刷新会回填（见 loadHistory）。 */
function clearChat(){
  $("msgs").innerHTML = "";
  $("histAside").innerHTML = "";
  // 窗口也空了（「新对话」把这一段收进长期库）：没有可撤的一轮，按钮跟着收掉，
  // 编辑态也没得编了（它指的正是那一段）。
  turnStack.length = 0;
  endEdit(true);
  bindLastTurn();
  // 备忘录面板不跟着清（它不是"这一段对话"的一部分）——重拉重挂。
  // 走 refreshMemos 而不是裸 mount：0 条时它会自己摘掉，不露出空面板。
  refreshMemos();
}
async function runDistill(){
  try{
    const d = await api("/api/distill", {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"});
    bubble("sys", "系统", d.started
      ? t("开始整理（后台跑：聚合摘要 → 抽象画像 → 收敛 → 老化）")
      : t("已经在整理中了"));
    refreshHeader();
  }catch(e){ bubble("sys","系统",t("整理失败：")+e.message); }
}

/* ---------- 右侧：唤醒详情 ---------- */
function cueLabel(k){
  return t({C1:"C1 语义",C2:"C2 时态",C3:"C3 情感",C4:"C4 自我相关",
            C5:"C5 自指",C6:"C6 新鲜",C7:"C7 未决"}[k] || k);
}
// 整轮卡点的中文名。**只翻名字不解释原因**：原因在 `suppressed_detail` 的
// 每条 why 里，写两遍就会跟后端漂移（阈值/判据一改，这边就说过时的话）。
const STAGE_LABEL = {R0:"R0 判「不翻」", weak_gate:"候选都没过相关性门"};
function renderWake(r, tools){
  if(!r) return;
  const cues = r.cues || {};
  const c3 = cues.C3 || {};
  // 命中与否**由后端算好**（`cues.hits`）——阈值住在配置里，页面不抄一份：
  // 抄了就会漂，而且降级时（阈值低得多）前端根本亮不起来。
  const hits = cues.hits || {};
  const hit = (k) => hits[k] ? "hit" : "";
  let h = `<div class="kv">
    <span class="${hit('C1')}">${cueLabel("C1")} ${fmt(cues.C1)}</span>
    <span class="${hit('C2')}">${cueLabel("C2")} ${esc(cues.C2)}</span>
    <span class="${hit('C3')}">${cueLabel("C3")} v=${c3.valence ?? "?"} a=${c3.arousal ?? "?"}</span>
    <span class="${hit('C4')}">${cueLabel("C4")} ${fmt(cues.C4)}</span>
    <span class="${hit('C5')}">${cueLabel("C5")} ${cues.C5??0}</span>
    <span class="${hit('C6')}">${cueLabel("C6")} ${fmt(cues.C6)}</span>
    <span class="${hit('C7')}">${cueLabel("C7")} ${cues.C7??0}</span>
    ${hits.entity?`<span class="hit">${t("实体命中")} ${(cues.entities||[]).map(esc).join(" / ")}</span>`:""}
    ${hits.literal?`<span class="hit">${t("字面命中")} ${Object.keys(cues.literal||{}).map(esc).join(" / ")}</span>`:""}
  </div>`;
  // 票数与强信号：**为什么给了原文（R5）**要在这儿答得出来——强维 2 票 / 弱维 1 票，
  // 数 hits 是数不出来的（后端算好随 `cues.votes` 一起给，2026-10-05）。
  const vt = cues.votes || {};
  h += `<div class="why" style="margin-top:4px">${t("票 {n}", {n: vt.votes ?? 0})}`
     + `${vt.strong?` · ${t("含强维")}`:""}`
     + `${(r.actions||{}).R5?` · ${t("→ 给原文")}`:` · ${t("不够，不给原文")}`}</div>`;
  const acts = r.actions || {};
  h += `<div class="kv" style="margin-top:8px">` +
    Object.keys(acts).map(k => `<span class="${acts[k]?"hit":""}">${esc(k)} ${acts[k]}</span>`).join("") +
    `</div>`;
  $("wakeCues").innerHTML = h;

  let m = "";
  (r.scenes||[]).forEach(s => { m += `<div class="row"><span class="t">${esc(s.id)}</span>${esc(s.title)}
      <div class="why">${esc(s.why||"")}</div></div>`; });
  (r.raws||[]).forEach(x => { m += `<div class="row"><span class="tag">${t("原文")}</span>${esc(x.content)}…</div>`; });
  // 画像行带编号（2026-09-23，同场景行）：他说「画像第一条 / S3-0001」时，
  // 界面上就能看出这一轮她拿到的是哪条——那次"她看不见画像"正好卡在这里
  (r.profiles||[]).forEach(p => { m += `<div class="row"><span class="tag ${p.status==="established"?"ok":"warn"}">${p.status==="established"?t("已立"):t("猜测")}</span><span class="t">${esc(p.id)}</span>${esc(p.statement)}</div>`; });
  // 常备备忘录（D2b；2026-10-05 晚并栏）：她这一轮**手上拿到**的那几件——**注入 ≠ 提**，
  // 他问起时答得上来靠的就是它。为什么要给（到点 / 相关 / 最近 / 追问）一并显出来：
  // 「她为什么答得出 / 答不出那件事」看的正是这一栏（07:04 事故的观测口）。
  // **到点那件打红标**（`due`）：它这一轮会进对话，也是"提过就不再进"的记账对象。
  // （原 `memo_candidates` 那一行随候选机制删除——那一路 2026-10-05 晚并进这里。）
  (r.standing_memos||[]).forEach(x => {
    const g = (x.group_name||"").trim();
    m += `<div class="row"><span class="tag${x.due?" warn":""}">${x.due?t("到点了"):t("手上有")}</span>`
      + `${g?`〔${esc(g)}〕`:""}${esc(x.id)}：${esc(x.content)}`
      + `<span class="why">　（${esc(t(x.why||""))}）</span></div>`; });
  // 一条都没想起来时，先说**卡在哪一步**——不然「这次没翻到东西」没有下文，
  // 看的人只能去猜是 R0 没让翻、还是门太严、还是库里真没有。
  if(r.stage) m += `<div class="why">${t("这一轮没想起东西（{why}）", {why: STAGE_LABEL[r.stage] || r.stage})}</div>`;
  // 抑制名单优先显示**带原因**的那份：「为什么没有它」要有答案，
  // 只有 id 的话，答案还留在别处（通常是没人记得去翻的代码里）。
  const sup = r.suppressed_detail || [];
  if(sup.length) m += `<div class="why">${t("没被带上：")}${sup.map(x => `${esc(x.id)} ${esc(x.why||"")}`).join("　")}</div>`;
  else if(r.suppressed && r.suppressed.length) m += `<div class="why">${t("没被带上：")}${r.suppressed.map(esc).join(" ")}</div>`;
  // 上下文总预算裁掉了什么，也要看得见：它连抑制名单都进不去
  // （抑制是"命中但没排上"，被裁的是"排上了又因总量被拿掉"），
  // 「应该出现的东西没出现」最难查，这里正是那一类。
  const bd = r.budget || {};
  if(bd.dropped && bd.dropped.length)
    m += `<div class="why">${t("上下文超预算（{a} → {b} / {c}），裁掉：", {a: bd.before, b: bd.after, c: bd.budget})}${bd.dropped.map(esc).join("　")}</div>`;
  else if(bd.alone)
    m += `<div class="why">${t("当前消息本身就 {a} / {b}：记忆全裁了也装不下，正文可能被截断", {a: bd.before, b: bd.budget})}</div>`;
  // air 这一轮动过什么（设计稿防错第 6 条：**可观测是它的兜底**）。
  // air 说「我记下了」而这里空着，就是没做——不留文本协议，靠看得见。
  (tools||[]).forEach(x => {
    const long = (x.detail || "").length > ACT_FOLD_CHARS;   // 长回执同聊天区：折
    m += `<div class="row"><span class="tag ${x.ok?"ok":"bad"}">${t("{p} 动手")}</span>`
      + `${esc(x.name)}　` + (long
        ? `<span class="why fold" style="display:block">${esc(x.detail)}</span>`
        : `<span class="why" style="display:inline">${esc(x.detail)}</span>`) + `</div>`; });
  const f = r.flags || {};
  if(f.hint_talked_before) m += `<div class="why">${t("提示：你们聊过这个")}</div>`;
  $("wakeMem").innerHTML = m || `<div class="empty">${t("这一轮没有注入记忆")}</div>`;
  // 折叠块统一在这里绑（innerHTML 拼出来的，绑不了 onclick 属性）
  $("wakeMem").querySelectorAll(".fold").forEach(el =>
    el.addEventListener("click", () => el.classList.toggle("open")));

  // 折叠条上给一句人能读的摘要——详情里那些 C1/R2/0.62 是给调试看的，
  // 平时只需要知道「air 想起了几件事」。
  // 折叠条上**也要提动作**：面板平时是收着的，动作写在里面等于没写。
  const ns = (r.scenes||[]).length, np = (r.profiles||[]).length;
  // ⚠️ 变量名不能再用 `acts`——上面（本函数内）已经有一个 `const acts = r.actions || {}`，
  // 同一作用域里重复声明 const 是**语法错误**，整个脚本都会挂掉（按钮全失效）。
  const actsDone = tools || [];
  let sum = (ns || np)
    ? t("这一轮想起 {n} 条场景", {n: ns}) + (np ? t(" · {n} 条常驻画像", {n: np}) : "")
    : t("这一轮没有想起具体的场景（只注入了常驻画像）");
  if(actsDone.length){
    const bad = actsDone.filter(x => !x.ok).length;
    sum += t(" · {p} 动过 {n} 下", {n: actsDone.length})
      + (bad ? t("（{ok} 成、{bad} 没成）", {ok: actsDone.length - bad, bad})
             : t("（都成了）"));
  }
  $("wakeSummary").textContent = sum + t(" —— 点开看为什么");
  $("wakeWrap").classList.toggle("acted", actsDone.length > 0);
}
const fmt = (v) => (v===null||v===undefined) ? "-" : (typeof v==="number" ? v.toFixed(3) : v);

/* ---------- 左侧导航 ---------- */
function renderTabs(){
  let h = "", grp = "";
  // ⚠️ 循环变量不能叫 `t`——会遮住全局的翻译函数（同 1062 行那条教训）
  TABS.forEach((name, i) => {
    const g = i === 0 ? "" : (NAV_GROUP[name] || "记忆库");
    if(g !== grp){ if(g) h += `<div class="grp">${t(g)}</div>`; grp = g; }
    h += `<button class="${name===activeTab?"active":""}" onclick="switchTab('${name}')">${t(name)}</button>`;
  });
  $("side").innerHTML = h;
}
function switchTab(t){ activeTab = t; renderTabs(); refreshPanel(); }
function toggleNav(){ $("main").classList.toggle("nav-hidden"); }
// 右列收起/展开（宽屏）：状态在 body.aside-hidden，按钮文字跟着翻。
// 与 ☰ 同一规矩：不持久化——刷新恢复默认（展开）。
function renderAsideBtn(){
  $("asideBtn").textContent = t(document.body.classList.contains("aside-hidden") ? "展开" : "收起");
}
function toggleAside(){
  document.body.classList.toggle("aside-hidden");
  renderAsideBtn();
  // 收起就是收起（2026-09-21 按反馈改）：**右列让位，内容留在右列**。
  // 旧行为是把「更早的对话」（压缩摘要那些块）搬进对话区顶部——结果收起后
  // 顶上冒出一坨摘要，与中间的「原文」重复、还打断对话流
  // （原话："点收起之后……反正摘要出来了"）。入口不缺：按钮就在顶栏，展开即见。
  // （窄屏本来没有右列，整个函数对它只意味着按钮不存在。）
}
// 「这一轮想起了什么」默认折起来：它是调试用的，不该常驻占地方。
function toggleWake(){ $("wakeWrap").classList.toggle("open"); }

async function refreshPanel(){
  // 对话和视图共用中间那一格：对话是常驻的，视图点开才盖上来。
  const isChat = activeTab === "对话";
  $("chatView").style.display = isChat ? "" : "none";
  $("panelView").style.display = isChat ? "none" : "";
  if(isChat) return;                 // 对话内容由 send() 维护，不重渲染
  const p = $("panel");
  let html = "";
  try{
    if(activeTab === "档案") html = await viewFacts();
    else if(activeTab === "画像") html = await viewMirror();
    else if(activeTab === "场景") html = await viewScenes();
    else if(activeTab === "摘要") html = await viewSummaries();
    else if(activeTab === "备忘录") html = await viewMemos();
    else if(activeTab === "实体") html = await viewEntities();
    else if(activeTab === "主题") html = await viewTopics();
    else if(activeTab === "打捞") html = await viewSalvage();
    else if(activeTab === "留痕") html = await viewTrace();
    else if(activeTab === "语音") html = await viewVoice();
    else if(activeTab === "设置") html = await viewSettings();
  }catch(e){ html = `<div class="empty">${t("读取失败：")}${esc(e.message)}</div>`; }
  p.innerHTML = pageHead(activeTab) + html;   // 页头在这一处加，各 view 不用管
}

async function viewFacts(){
  const d = await api("/api/facts");
  const list = d.facts || [];
  const have = {};
  list.forEach(f => have[f.key] = f);
  // 常用键由后端给（`model.FACT_KEYS`）——页面里不抄一份，抄了就会漂移
  const keys = [...new Set([...(d.base||[]), ...list.map(f => f.key)])];
  const rows = keys.map(k => {
    const f = have[k] || {};
    const tag = f.source === "inferred" ? `<span class="tag warn">${t("{p} 推的")}</span>` : "";
    const note = f.note ? `<div class="why">${esc(f.note)}</div>` : "";
    return `<label>${esc(k)}</label>
      <div><input class="f" data-fact="${esc(k)}" value="${esc(f.value||"")}"
                  placeholder="${t("（没填）")}">${tag}${note}</div>`;
  }).join("");
  return `
  <div class="grid2" id="factGrid">${rows}</div>
  <div style="margin-top:16px;display:flex;gap:8px;align-items:center">
    <button class="primary" onclick="saveFacts()">${t("保存")}</button>
    <button class="ghost" onclick="addFactRow()">${t("加一项")}</button>

async function viewMirror(){
  const d = await api("/api/mirror");
  // 「整理」放在这里而不是对话区：它和「新对话」是**包含关系**——
  // 新对话 = 提取 + 整理 + 清窗口；这里只是把已有的重新归置一遍，不动当前对话。
  // 两个按钮并排摆着会让人以为它们等价（看着确实像，问出来了）。
  const bar = `<div class="why" style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
    <span style="margin:0">${t("刚聊完、还没形成画像时，点右边跑一遍。")}</span>
    <button class="ghost" onclick="runDistill()">${t("重新整理")}</button></div>`;
  // 上次整理干了什么（数据在 `/api/mirror` 里）：按了按钮总得看见结果——
  // 新增/收敛/老化这些数字在这儿；「没立的画像卡在哪一关」也在这儿说清楚
  //（「画像没立」本身不含任何可行动信息，这是设计里点名的调试点）。
  // 2026-09-23：体检的结果也走同一处（带 trigger 字段的就是体检，记忆整理稿 §九）
  const ld = d.last_distill || {};
  const n = (a) => (a || []).length;
  const ldHead = ("s2_new" in ld)
    ? (ld.trigger ? t("上次体检（{why}）：", {why: ld.trigger}) : t("上次整理："))
      + t("S2 新增 {a} · S3 新增 {b} · 维持 {c} · 修正 {d} · 收敛 {e} · 老化 {f}",
          {a: n(ld.s2_new), b: n(ld.s3_new), c: n(ld.held),
           d: n(ld.revised), e: n(ld.established), f: n(ld.aged)})
    : t("还没跑过整理。");
  const rv = ld.review || {};
  const rvLine = n(rv.checked)
    ? `<div class="why" style="margin:-4px 0 8px">${
        t("复核 {n} 条：降档 {d} · 复查降 {g} · 重写 {r} · 建议删 {w}",
          {n: n(rv.checked), d: n(rv.downgraded), g: n(rv.regressed),
           r: n(rv.reworded), w: n(rv.suggested)})}</div>`
    : "";
  const ldLine = `<div class="why" style="margin:-6px 0 8px">${ldHead}</div>` + rvLine;
  const reviews = d.reviews || [];
  // 复核提议（记忆整理稿 §五）：她打了 wrong 的那几条——**只建议不执行**。
  // 两个动作给全：「删除」走人的否决（同一个出口，真删），「留着」只让提议过期。
  const reviewsLine = reviews.length ? `
    <div class="why" style="margin:0 0 12px;padding:8px 10px;border:1px solid #d9a441;border-radius:6px">
      <b>${t("{p} 的复核提议（{n} 条）：复查后觉得不对，等你裁决——删掉要你点，{p} 不会自己动。", {n: reviews.length})}</b>
      ${reviews.map(r => `<div style="margin:6px 0 0">
        <span class="mono">${esc(r.profile_id)}</span> ${esc(r.statement)}
        <div class="why">${t("理由：")}${esc(r.reason || t("（没给理由）"))}</div>
        <button class="ghost" data-pid="${esc(r.profile_id)}" data-stmt="${esc(r.statement)}" onclick="rejectProfile(this)">${t("删除")}</button>
        <button class="ghost" onclick="keepReview('${esc(r.id)}')">${t("留着")}</button>
      </div>`).join("")}
    </div>` : "";
  const blockedLine = n(ld.blocked)
    ? `<div class="why" style="margin:0 0 14px">${t("未收敛（为什么没立）：")}`
      + ld.blocked.slice(0, 5).map(b =>
          `${esc(b.id)}「${esc(b.topic)}」${esc(b.reason)}`).join("；")
      + `</div>`
    : "";
  if(!d.profiles.length)
    return bar + ldLine + reviewsLine + blockedLine
      + `<div class="empty">${t("还没有画像——再多聊几轮，或点「重新整理」看看现在能抽出什么。")}</div>`;
  let h = bar + ldLine + reviewsLine + blockedLine
    + `<table><tr><th style="width:88px">id</th><th>${t("陈述")}</th><th style="width:90px">${t("状态")}</th><th style="width:60px">${t("印证")}</th><th>${t("依据")}</th><th style="width:150px">${t("操作")}</th></tr>`;
  d.profiles.forEach(p => {
    const tag = p.status === "established" ? `<span class="tag ok">${t("已立")}</span>`
                                           : `<span class="tag warn">${t("猜测")}</span>`;
    const src = p.sources.map(s =>
      `<div class="mono">${s.role === "forming" ? t("◆ 出处") : t("· 印证")} ${esc(s.id)} `
      + `(${esc(s.time)}) ${esc(s.title)}</div>`).join("");
    const hid = p.hidden_sensitive ? `<div class="why">${t("另有 {n} 条依据涉及隐私，未展示", {n: p.hidden_sensitive})}</div>` : "";
    // 「不对」按钮对应「哪条不对你直接说」——那条提示以前只是句文案，没有可以说的入口。
    // **真删**（2026-09-24）：删的是一条不成立的推断——素材都在，判断真成立会重立；
    // 唯一要防的是误操作，所以弹一次确认窗（statement 经 data- 属性带，避开引号）。
    h += `<tr><td class="mono">${esc(p.id)}</td><td>${esc(p.statement)}
      <div class="why">${esc((p.topics||[p.topic]).join(" / "))}</div></td><td>${tag}</td><td class="mono">${p.evidence}</td>
      <td>${src}${hid}</td>
      <td><button class="ghost" onclick="editProfile('${esc(p.id)}')">${t("改")}</button>
          <button class="ghost" onclick="editProfileTopic('${esc(p.id)}')">${t("改主题")}</button>
          <button class="ghost" data-pid="${esc(p.id)}" data-stmt="${esc(p.statement)}" onclick="rejectProfile(this)">${t("不对")}</button></td></tr>`;
  });
  h += `</table>`;
  if(d.patterns && d.patterns.length){
    h += `<h2 style="margin:16px 0 6px">${t("模式统计（人做不到，{p} 可以）")}</h2><table>
      <tr><th>${t("情境 × 对象")}</th><th style="width:60px">${t("次数")}</th><th>${t("典型反应")}</th></tr>`;
    d.patterns.forEach(x => {
      h += `<tr><td>${t("面对【{a}】的【{b}】", {a: esc(x.entity), b: esc(x.trigger_class)})}</td>
        <td class="mono">${x.count}</td><td>${x.reactions.map(esc).join(" / ") || "—"}</td></tr>`;
    });
    h += `</table>`;
  }
  if(d.can_reject) h += `<div class="why" style="margin-top:10px">${esc(d.reject_hint)}${t("——右边「不对」即可删掉它；「改」走修正（旧版进历史、新版重新攒印证）。")}</div>`;
  return h;
}

async function rejectProfile(btn){
  // 否决一条画像 = **真删**（2026-09-24）：删的是"一条不成立的推断"——
  // 素材（原话 / 场景 / 摘要）都在，判断真成立会被重新立出来。
  // 所以不需要"留后路"那一档：唯一要防的是误操作，弹一次确认窗就够。
  // 参数收按钮而不是 id：statement 经 data- 属性来——`esc` 不转单引号，
  // 拼进 onclick('...') 会被他话里的撇号打断。
  const id = btn.dataset.pid, stmt = btn.dataset.stmt || "";
  if(!confirm(t("删掉 {id}「{statement}」？\n\n素材都在（原话 / 场景 / 摘要）——这条判断真成立的话，以后会重新立出来。",
                {id, statement: stmt}))) return;
  try{
    const d = await api("/api/reject", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({id})});
    if(!d.ok){ alert(t("没找到这条画像")); return; }
    bubble("sys", "系统", t("已删掉 {id}。", {id}));
    refreshAll();
  }catch(e){ alert(t("删除失败：") + e.message); }
}

async function keepReview(id){
  // 「留着」：人看过提议、决定不动这条画像——提议过期，画像一个字不改。
  // 不弹确认：这是**保守**选项（什么都不发生），点错了的代价是零。
  try{
    await api("/api/reviews", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({id})});
    refreshAll();
  }catch(e){ alert(t("操作失败：") + e.message); }
}

function editProfile(id){
  // 改一条判断的说法（三层同一套）：**走修正**——旧版本填 `invalidated_at`
  // 进历史，新版回 pending **重新攒印证**（判断不能凭空改写：改了就是新判断）。
  const text = prompt(t("改成什么？（{id} 的陈述）\n\n改完之后是**新判断**：旧说法进历史，新说法回去重新攒印证。", {id}), "");
  if(text === null) return;
  memAction([id], "update", text);
}
function editProfileTopic(id){
  // 改主题（**标签**，2026-09-24）：改的是归类——判断本身不动
  // （依据链、印证数、时间戳照旧；与「改」走修正的区别就在这）。
  const topic = prompt(t("新主题是什么？（{id}）\n\n1-3 个，逗号隔开（第一个是主主题）。改的是归类：判断本身不动，依据和印证照旧。", {id}), "");
  if(topic === null) return;
  memAction([id], "update", topic, "主题");
}

function deleteMany(){
  // 批量删：一次填多个编号（**三层混着填也行**——后端按前缀分派）。
  // "先校验再动手"在后端（`weave.delete_by_layer`）：有一个找不到就一条都不删。
  const raw = prompt(t("要删哪些？编号用逗号或空格隔开\n（例如 S1-0001,S1-0003）"), "");
  if(raw === null) return;
  const ids = raw.split(/[,，、;；\s]+/).map(s => s.trim()).filter(Boolean);
  if(!ids.length) return;
  memAction(ids, "delete");
}

// ---- 记忆动作的统一口（2026-09-24，工具箱稿 §3.4）----
// 改 / 删 / 归档 / 取消归档——**三层同一个口**（场景 / 摘要 / 画像）。
// 后端按编号前缀分派（`/api/memory-action` → `weave.*_by_layer`）：
// 对话里她提议、他点确认条，是**另一条入口**，落到同一批动作上。
// `ids` 可以多条（删除 / 归档 / 取消都是"要么全动、要么不动"）；改一次一条。
async function memAction(ids, action, text, field){
  if(action === "delete"){
    const msg = ids.length === 1
      ? t("真删掉 {id}？\n\n没有备份，删了就没了——要留后路请用「归档冷存」。", {id: ids[0]})
      : t("真删掉这 {n} 条？\n{ids}\n\n没有备份，删了就没了——要留后路请用「归档」。",
          {n: ids.length, ids: ids.join("、")});
    if(!confirm(msg)) return;
  }
  try{
    const d = await api("/api/memory-action", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ids, action, text, field})});
    if(!d.ok){ alert(d.detail || t("没成")); return; }
    const done = d.ids && d.ids.length ? d.ids : [];
    if(!done.length){
      // 归档已在冷层的、取消已在热层的：动作有效但一条都没变——如实说，别假装做了
      bubble("sys", "系统", t("没动——它已经在那个状态了。"));
      refreshAll(); return;
    }
    const idsS = done.join("、");
    if(action === "delete") bubble("sys","系统", t("已删 {ids}——真删，没有备份。", {ids: idsS}));
    if(action === "archive") bubble("sys","系统", t("已归档 {ids}——{p} 不会再想起它，数据都在，还能捞回来。", {ids: idsS}));
    if(action === "unarchive") bubble("sys","系统", t("已把 {ids} 放回热层。", {ids: idsS}));
    if(action === "update") bubble("sys","系统", t("已改 {id}：旧值留在留痕里了。", {id: ids[0]}));
    refreshAll();
  }catch(e){ alert(t("操作失败：") + e.message); }
}

function editScene(id){
  // 改场景的**可改字段**（2026-09-24）：先问改哪个（默认摘要），再问新值。
  // 能改 = 语义描述类：摘要 / 标题 / 主题 / 事件时间 / 情境 / 反应 / 情境类
  // （数值与系统字段不开——见后端 `store.SCENE_EDITABLE`）。
  // 原文永远不动，改前的值会留痕（分清「当时发生什么」和「后来怎么理解」）。
  const field = prompt(t("改哪个字段？（摘要 / 标题 / 主题 / 事件时间 / 情境 / 反应 / 情境类）"), t("摘要"));

  const text = prompt(t("改成什么？（{id} 的{field}）", {id, field: f}), "");
  if(text === null) return;
  memAction([id], "update", text, f);
}

/* 把两个实体合成一个（「两个小明是同一个人」）——**只有人能发起**：
   系统只做精确匹配 + 别名，"是不是同一个人"是语义判断，猜错的代价
   是把两条线索悄悄并成一条（见 entity.link_entities 的保守原则）。
   实体的"人工口子"就是这个——add_entity 的 aliases 参数一直够不着。 */
async function mergeEntity(fromId){
  const list = await api("/api/entities");
  const src = list.find(x => x.id === fromId);
  if(!src) return;
  const others = list.filter(x => x.id !== fromId);
  if(!others.length){ alert(t("只有一个实体，没有可并的对象。")); return; }
  const hint = others.map(x => x.name
    + ((x.aliases||[]).length ? `（${x.aliases.join("、")}）` : "")).join("、");
  const to = (window.prompt(
    t("把「{name}」并进哪个实体？填它的名字：", {name: src.name}) + "\n\n" + hint) || "").trim();
  if(!to) return;
  const hit = others.find(x => x.name === to || (x.aliases||[]).includes(to));
  if(!hit){ alert(t("没找到叫「{name}」的实体。", {name: to})); return; }
  if(!confirm(t("把「{a}」并进「{b}」？\n\n它名下 {n} 条场景会改挂过去，不删记录、会留痕。\n合并不可撤回——只能反着再合一次。", {a: src.name, b: hit.name, n: src.scenes}))) return;
  try{
    const d = await api("/api/entity-merge", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify({from: fromId, to: hit.id})});
    if(!d.ok){ alert(t("合并失败：") + (d.detail || "")); return; }
    alert(t("已合并：{n} 条场景改挂到「{b}」，{k} 个别名并了过去。", {n: d.scenes, b: d.name, k: d.aliases}));
    switchTab("实体");
  }catch(e){ alert(t("合并失败：") + e.message); }
}

function salvageTable(rows){
  if(!rows.length) return `<div class="empty">${t("这个范围里没有。换个词，或者把日期放宽。")}</div>`;
  let h = `<table><tr><th style="width:88px">${t("编号")}</th><th style="width:150px">${t("日期 时间")}</th>
    <th>${t("原文片段")}</th><th style="width:140px">${t("库里")}</th></tr>`;
  rows.forEach(r => {
    h += `<tr><td class="mono">${esc(r.scene_id)}</td>
      <td class="mono">${esc(r.day)} ${esc((r.time || "").slice(0, 8))}</td>
      <td>${esc(r.snippet)}</td>
      <td>${r.in_library ? `<span class="tag ok">${t("在")}</span>`
        : `<span class="tag warn">${t("已删")}</span>
           <button class="ghost"
             onclick="salvageRebuild('${esc(r.scene_id)}','${esc(r.day)}')">${t("重新记下")}</button>`}</td></tr>`;
  });
  return h + `</table>`;
}

async function runSalvage(){
  const out = $("svOut"); if(!out) return;
  const q = ($("svQ") || {}).value || "";
  const from = ($("svFrom") || {}).value || "", to = ($("svTo") || {}).value || "";
  out.innerHTML = `<div class="empty">${t("翻原文中…")}</div>`;
  try{
    const d = await api(`/api/salvage?q=${encodeURIComponent(q)}&from=${from}&to=${to}&limit=30`);
    out.innerHTML = salvageTable(d.rows || []);
  }catch(e){ out.innerHTML = `<div class="empty">${t("没查成：")}${esc(e.message)}</div>`; }
}

/* 留痕页（2026-10-07 重写分派）：**按 `kind` 分**，不再靠字段猜形状。
   猜的那版有三处走样：「工具」「档案」「场景改动」都掉进最后的 else，被硬当
   "漂移检测"渲染——"检查 undefined 个主题，漂移 0 个"就是这么冒出来的。
   `kind` 由后端按文件名前缀补上（见 `dashboard.App.trace`）。

   一行 = 她做过的一件事：怎么判的（唤醒）、动了什么（工具 / 备忘 / 档案 / 场景）、
   整理与漂移一遍。**认不出的类别就如实显示它是什么**，不冒充别的。 */
async function viewTrace(){
  const d = await api("/api/trace?limit=25");
  if(!d.length) return `<div class="empty">${t("还没有留痕。每次唤醒都会落一行。")}</div>`;
  let h = "";
  // ⚠️ 循环变量不能叫 `t`（会遮住全局翻译函数）——用 `rec`（一条 trace 记录）
  // 时间戳：**跨天要看得见日期**。现在读的是最近若干份文件（可能横跨几天），
  // 只写 HH:MM 的话，昨天那条和刚刚那条分不出来。当天只写时刻，更早的带上月-日。
  const today = new Date();
  const todayKey = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2, "0")}`
    + `-${String(today.getDate()).padStart(2, "0")}`;
  d.forEach(rec => {
    const day = (rec.ts || "").slice(0, 10), hm = (rec.ts || "").slice(11, 16);
    const ts = `<span class="t">${esc(day === todayKey ? hm : `${day.slice(5)} ${hm}`)}</span>`;
    let body;
    if(rec.kind === "唤醒" || rec.input !== undefined){
      // 她开口之前系统判了什么：想起谁、凭什么、压住了谁、手上挂着哪几件
      const r = (rec.recalled||[]).map(x => `${esc(x.id)}(${esc(x.why)})`).join("；") || t("（无）");
      body = `<b>${esc(rec.input||"")}</b>
        <div class="why">${t("动作")} ${esc(JSON.stringify(rec.actions||{}))}</div>
        <div class="why">${t("召回")} ${r}</div>
        ${rec.suppressed && rec.suppressed.length ? `<div class="why">${t("抑制")} ${rec.suppressed.map(esc).join(" ")}</div>`:""}
        ${(rec.standing_memos||[]).length ? `<div class="why">${t("手上有")} ${rec.standing_memos.map(esc).join(" ")}`
          + `${(rec.memos_due||[]).length ? `　·　${t("到点")} ${rec.memos_due.map(esc).join(" ")}`:""}</div>`:""}`;
    } else if(rec.kind === "备忘"){
      // 「这条为什么不再提了」的答案在这儿（字段见 `memo.write_memo_trace`）
      body = `<b class="drift">${t("备忘")} · ${esc(t(rec.act||""))}</b> ${esc(rec.id||"")}
        <div class="why">${esc(rec.content||"")}${rec.by?`　·　${esc(t(rec.by))}`:""}</div>`;
    } else if(rec.kind === "工具"){
      // 她的手：这一轮调了什么、成没成（三档权限都从这儿看）。
      // `detail` 是她拿到的东西——memory_search 那种能到几千字，**截断**：
      // 这一页是"最近发生了什么"的流水，不是读结果的地方（要看全文去对话里点开回执）
      const det = rec.detail || "";
      body = `<b class="drift">${t("工具")} · ${esc(rec.tool||"")}</b>
        <div class="why">${esc(det.length > 400 ? det.slice(0, 400) + "…" : det)}</div>
        ${rec.ok ? "" : `<div class="why">${t("没做成：")}${esc(JSON.stringify(rec.args||{}))}</div>`}`;
    } else if(rec.kind === "漂移"){
      // 渐变：她长期形成的判断有没有在慢慢挪（只提疑问，不动手）
      body = `<b class="drift">${t("漂移检测")}</b>
        <div class="why">${t("检查 {n} 个主题，漂移 {m} 个", {n: rec.checked, m: (rec.drifting||[]).length})}
        ${(rec.revised||[]).length?t("，修正 ")+rec.revised.map(esc).join(" "):""}</div>
        ${(rec.drifting||[]).map(x=>`<div class="why">· ${esc(x.topic)}：${esc(x.reason)} → ${esc(x.verdict)}</div>`).join("")}`;
    } else if(rec.kind === "整理"){
      // 体检：这一趟整理做了什么（S2 聚合 / S3 抽象 / 收敛 / 老化）
      body = `<b class="drift">${t("体检")}</b>${rec.trigger?`　<span class="why">${esc(rec.trigger)}</span>`:""}
        <div class="why">${t("S2 新增 {a} · S3 新增 {b} · 维持 {c} · 修正 {d} · 收敛 {e} · 老化 {f}",
          {a:(rec.s2_new||[]).length, b:(rec.s3_new||[]).length, c:rec.held||0,
           d:(rec.revised||[]).length, e:(rec.established||[]).length, f:(rec.aged||[]).length})}</div>`;
    } else if(rec.kind === "档案" || rec.kind === "场景改动"){
      // 他手填的档案 / 场景字段的改动（改了哪个字段、从什么改成什么）
      body = `<b class="drift">${t(rec.kind)}</b> ${esc(rec.key || rec.id || "")}
        <div class="why">${rec.field?`${esc(rec.field)}：`:""}${esc(rec.from||"")} → ${esc(rec.to||"")}`
        + `${rec.action?`　·　${esc(t(rec.action))}`:""}</div>`;
    } else if(rec.kind === "否决"){
      // 他否决掉的一条画像（真删；重立靠新印证，见 `weave.user_reject_profile`）
      body = `<b class="drift">${t("否决画像")}</b> ${esc(rec.profile_id||"")}
        <div class="why">${esc(rec.statement||"")}</div>
        <div class="why">${esc(rec.status_before||"")} → ${esc(rec.outcome||"")}`
        + `${rec.reason?`　·　${esc(rec.reason)}`:""}</div>`;
    } else {
      body = `<b class="drift">${esc(rec.kind || "?")}</b>
        <div class="why">${esc(JSON.stringify(rec))}</div>`;
    }
    h += `<div class="row">${ts}${body}</div>`;
  });
  return h;
}

    ${t("下次双击 启动.vbs 就回来：它一起把语音服务也拉起来，而且不挂黑框。")}
